<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>くらしログ</title>
<style>
  :root{
    --bg:#0F1417;
    --surface:#181F23;
    --surface-2:#1F282D;
    --border:#2A343A;
    --text:#F2F5F4;
    --muted:#8FA0A6;
    --stock:#3DDC97;
    --stock-dim:#245C43;
    --finance:#4FA3E3;
    --finance-dim:#1E4A6B;
    --danger:#E8695A;
    --radius:14px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100%;
  }
  header{
    padding:calc(18px + var(--safe-top)) 20px 16px;
    flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--muted);
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:16px 16px calc(96px + var(--safe-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ---- Stock cards ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .card-info{min-width:0;flex:1;}
  .card-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .stepper button{
    width:36px;height:36px;border-radius:10px;border:none;
    background:var(--surface-2);color:var(--stock);
    font-size:20px;line-height:1;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper button:active{background:var(--stock-dim);}
  .stepper .count{min-width:26px;text-align:center;font-size:17px;font-weight:700;}
  .empty-msg{color:var(--muted);font-size:14px;text-align:center;padding:32px 0;}

  /* ---- Forms ---- */
  .section-title{
    font-size:13px;color:var(--muted);font-weight:600;
    margin:24px 0 10px;letter-spacing:.3px;
  }
  form{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
  }
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 12px;
    font-size:16px;
    appearance:none;
  }
  select{
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;
  }
  .hybrid-input{margin-top:8px;display:none;}
  details{border-top:1px solid var(--border);margin-top:6px;padding-top:10px;}
  summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary:before{content:"▸ ";}
  details[open] summary:before{content:"▾ ";}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .submit-btn{
    width:100%;border:none;border-radius:10px;padding:13px;
    font-size:16px;font-weight:700;margin-top:4px;color:#0B1210;
  }
  #stock-panel .submit-btn{background:var(--stock);}
  #finance-panel .submit-btn{background:var(--finance);}
  .submit-btn:active{opacity:.8;}

  /* ---- Tab bar ---- */
  nav.tabbar{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;
    background:rgba(24,31,35,.92);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding:8px 8px calc(8px + var(--safe-bottom));
  }
  nav.tabbar button{
    flex:1;background:none;border:none;color:var(--muted);
    font-size:12px;font-weight:600;padding:8px 0 4px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  nav.tabbar button .dot{width:6px;height:6px;border-radius:50%;background:transparent;}
  nav.tabbar button.active{color:var(--text);}
  nav.tabbar button[data-tab="stock"].active .dot{background:var(--stock);}
  nav.tabbar button[data-tab="finance"].active .dot{background:var(--finance);}

  #toast{
    position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);padding:10px 18px;border-radius:999px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="page-title">在庫管理</h1>
    <p id="page-sub">タップして数量を更新</p>
  </header>

  <main>
    <!-- ===== 在庫タブ ===== -->
    <section id="stock-panel" class="tab-panel active">
      <div id="stock-list"><p class="empty-msg">読み込み中…</p></div>

      <div class="section-title">新しく登録する</div>
      <form id="stock-form">
        <div class="field">
          <label>商品名</label>
          <input type="text" id="s-name" required placeholder="例：ティッシュ">
        </div>
        <div class="row2">
          <div class="field">
            <label>個数</label>
            <input type="number" id="s-value" required value="1" inputmode="numeric">
          </div>
        </div>
        <div class="field">
          <label>収納場所</label>
          <select id="s-location-select" class="hybrid-select"></select>
          <input type="text" id="s-location-input" class="hybrid-input" placeholder="新しい収納場所を入力">
        </div>
        <div class="field">
          <label>タグ</label>
          <select id="s-tags-select" class="hybrid-select"></select>
          <input type="text" id="s-tags-input" class="hybrid-input" placeholder="新しいタグを入力（カンマ区切り可）">
        </div>
        <details>
          <summary>賞味期限・型番（任意）</summary>
          <div class="field" style="margin-top:10px;">
            <label>賞味期限</label>
            <input type="date" id="s-expiration">
          </div>
          <div class="field">
            <label>型番</label>
            <input type="text" id="s-model" placeholder="例：EC-CT12">
          </div>
        </details>
        <button type="submit" class="submit-btn">この商品を登録</button>
      </form>
    </section>

    <!-- ===== 家計簿タブ ===== -->
    <section id="finance-panel" class="tab-panel">
      <div class="section-title">支出を記録する</div>
      <form id="finance-form">
        <div class="field">
          <label>カテゴリ</label>
          <select id="f-category-select" class="hybrid-select"></select>
          <input type="text" id="f-category-input" class="hybrid-input" placeholder="新しいカテゴリを入力">
        </div>
        <div class="field">
          <label>金額（円）</label>
          <input type="number" id="f-amount" required inputmode="numeric" placeholder="850">
        </div>
        <div class="field">
          <label>メモ</label>
          <input type="text" id="f-memo" placeholder="例：スーパー">
        </div>
        <div class="field">
          <label>タグ</label>
          <select id="f-tags-select" class="hybrid-select"></select>
          <input type="text" id="f-tags-input" class="hybrid-input" placeholder="新しいタグを入力（カンマ区切り可）">
        </div>
        <button type="submit" class="submit-btn">記録する</button>
      </form>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="stock" class="active"><span class="dot"></span>在庫管理</button>
    <button data-tab="finance"><span class="dot"></span>家計簿</button>
  </nav>
</div>
<div id="toast"></div>

<script>
/* ▼▼▼ ここにデプロイしたGASのウェブアプリURLを貼り付けてください ▼▼▼ */
const GAS_URL = "ここにGASのWebアプリURLを貼り付け";
/* ▲▲▲ 例: https://script.google.com/macros/s/xxxxx/exec ▲▲▲ */

let stockCache = [];

// ---------- 共通ユーティリティ ----------
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

function postToGas(payload){
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight回避のためtext/plainで送る
    body: JSON.stringify(payload)
  }).then(r => r.json());
}

function setupHybrid(selectEl, inputEl, presetValues){
  selectEl.innerHTML = '';
  presetValues.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    selectEl.appendChild(opt);
  });
  const blank = document.createElement('option');
  blank.value = ''; blank.textContent = '（未選択）';
  selectEl.insertBefore(blank, selectEl.firstChild);
  const newOpt = document.createElement('option');
  newOpt.value = '__new__'; newOpt.textContent = '＋ 新規入力';
  selectEl.appendChild(newOpt);

  selectEl.onchange = () => {
    if(selectEl.value === '__new__'){
      inputEl.style.display = 'block';
      inputEl.value = '';
      inputEl.focus();
    } else {
      inputEl.style.display = 'none';
    }
  };
}
function getHybridValue(selectEl, inputEl){
  if(selectEl.value === '__new__') return inputEl.value.trim();
  return selectEl.value;
}

// ---------- タブ切り替え ----------
document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById(tab === 'stock' ? 'stock-panel' : 'finance-panel').classList.add('active');
    document.getElementById('page-title').textContent = tab === 'stock' ? '在庫管理' : '家計簿';
    document.getElementById('page-sub').textContent = tab === 'stock' ? 'タップして数量を更新' : '支出を記録';
  });
});

// ---------- 在庫リスト ----------
function renderStockList(){
  const wrap = document.getElementById('stock-list');
  if(!stockCache.length){
    wrap.innerHTML = '<p class="empty-msg">まだ登録された商品がありません</p>';
    return;
  }
  wrap.innerHTML = '';
  stockCache.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card';
    const metaParts = [item.location, item.tags].filter(Boolean).join(' ・ ');
    card.innerHTML = `
      <div class="card-info">
        <div class="card-name">${escapeHtml(item.itemName)}</div>
        <div class="card-meta">${escapeHtml(metaParts || '—')}</div>
      </div>
      <div class="stepper">
        <button data-action="minus" type="button">−</button>
        <span class="count">${item.stock ?? 0}</span>
        <button data-action="plus" type="button">＋</button>
      </div>`;
    const countEl = card.querySelector('.count');
    card.querySelector('[data-action="minus"]').addEventListener('click', ()=>bump(item, -1, countEl));
    card.querySelector('[data-action="plus"]').addEventListener('click', ()=>bump(item, 1, countEl));
    wrap.appendChild(card);
  });
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function bump(item, delta, countEl){
  const prev = Number(item.stock) || 0;
  item.stock = prev + delta; // 楽観的更新
  countEl.textContent = item.stock;
  postToGas({
    type: 'stock', target: item.itemName, value: delta,
    location: '', tags: '', expirationDate: '', modelNumber: ''
  }).then(res=>{
    if(res.status !== 'success'){
      item.stock = prev; countEl.textContent = prev;
      toast('更新に失敗しました');
    }
  }).catch(()=>{
    item.stock = prev; countEl.textContent = prev;
    toast('通信エラー');
  });
}

function loadStock(){
  fetch(`${GAS_URL}?action=getStock&t=${Date.now()}`)
    .then(r => r.json())
    .then(rows=>{
      stockCache = rows;
      renderStockList();
      const locs = [...new Set(['洗面所の下','キッチン','冷蔵庫', ...rows.map(r=>r.location).filter(Boolean)])];
      const tagsAll = [...new Set(['日用品','食品','ストック', ...rows.flatMap(r=>String(r.tags||'').split(',').map(s=>s.trim())).filter(Boolean)])];
      setupHybrid(document.getElementById('s-location-select'), document.getElementById('s-location-input'), locs);
      setupHybrid(document.getElementById('s-tags-select'), document.getElementById('s-tags-input'), tagsAll);
    })
    .catch(()=>{
      document.getElementById('stock-list').innerHTML = '<p class="empty-msg">読み込みに失敗しました。GAS_URLを確認してください</p>';
    });
}

// ---------- 新規商品登録 ----------
document.getElementById('stock-form').addEventListener('submit', e=>{
  e.preventDefault();
  const name = document.getElementById('s-name').value.trim();
  const value = Number(document.getElementById('s-value').value) || 0;
  const location = getHybridValue(document.getElementById('s-location-select'), document.getElementById('s-location-input'));
  const tags = getHybridValue(document.getElementById('s-tags-select'), document.getElementById('s-tags-input'));
  const expirationDate = document.getElementById('s-expiration').value;
  const modelNumber = document.getElementById('s-model').value.trim();
  if(!name) return;

  postToGas({ type:'stock', target:name, value, location, tags, expirationDate, modelNumber })
    .then(res=>{
      if(res.status === 'success'){
        toast('登録しました');
        e.target.reset();
        document.getElementById('s-value').value = 1;
        loadStock();
      } else {
        toast('登録に失敗しました');
      }
    }).catch(()=>toast('通信エラー'));
});

// ---------- 家計簿 ----------
setupHybrid(document.getElementById('f-category-select'), document.getElementById('f-category-input'), ['食費','日用品','交通費','娯楽','医療','その他']);
setupHybrid(document.getElementById('f-tags-select'), document.getElementById('f-tags-input'), ['外食','贅沢','必需品','特売']);

document.getElementById('finance-form').addEventListener('submit', e=>{
  e.preventDefault();
  const category = getHybridValue(document.getElementById('f-category-select'), document.getElementById('f-category-input'));
  const amount = Number(document.getElementById('f-amount').value) || 0;
  const memo = document.getElementById('f-memo').value.trim();
  const tags = getHybridValue(document.getElementById('f-tags-select'), document.getElementById('f-tags-input'));
  if(!category || !amount) return;

  postToGas({ type:'finance', category, amount, memo, tags })
    .then(res=>{
      if(res.status === 'success'){
        toast('記録しました');
        e.target.reset();
      } else {
        toast('記録に失敗しました');
      }
    }).catch(()=>toast('通信エラー'));
});

// ---------- 初期化 ----------
loadStock();
</script>
</body>
</html>
