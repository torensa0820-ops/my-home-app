<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>くらしログ</title>
<style>
  :root{
    --bg:#0F1417;
    --surface:#181F23;
    --surface-2:#1F282D;
    --border:#2A343A;
    --text:#F2F5F4;
    --muted:#8FA0A6;
    --stock:#3DDC97;
    --stock-dim:#245C43;
    --finance:#4FA3E3;
    --finance-dim:#1F4A6B;
    --chore:#F2B84B;
    --chore-dim:#7A5A1E;
    --danger:#F0616D;
    --danger-dim:#5C262B;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:calc(12px + var(--safe-top)) 20px 16px;flex-shrink:0;border-bottom:1px solid var(--border);}
  .app-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;}
  .brand img{width:22px;height:22px;border-radius:6px;}
  .icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;}
  .icon-btn:active{background:var(--surface-2);}
  .icon-btn.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  header h1{margin:0;font-size:20px;font-weight:700;}
  header p{margin:4px 0 0;font-size:13px;color:var(--muted);}
  main{flex:1;overflow-y:auto;padding:16px 16px calc(96px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .card-info{min-width:0;flex:1;cursor:pointer;}
  .card-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .stepper button{width:36px;height:36px;border-radius:10px;border:none;background:var(--surface-2);color:var(--stock);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .stepper button:active{background:var(--stock-dim);}
  .stepper .count{min-width:26px;text-align:center;font-size:17px;font-weight:700;}
  /* 賞味期限の異なるロットを持つ商品 */
  .card.multi{flex-direction:column;align-items:stretch;gap:10px;}
  .card-top{display:flex;align-items:center;gap:12px;}
  .card-total{flex-shrink:0;font-size:13px;font-weight:700;color:var(--muted);}
  .lots{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:10px;}
  .lot{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .lot-exp{font-size:13px;color:var(--muted);}
  .exp.soon{color:var(--chore);font-weight:700;}
  .exp.expired{color:var(--danger);font-weight:700;}
  .lot-edit{display:grid;grid-template-columns:1fr 84px 40px;gap:8px;align-items:center;margin-bottom:8px;}
  .lot-head{margin-bottom:6px;}
  .lot-head label{margin:0 !important;}
  .lot-remove{height:40px;border:1px solid var(--border);border-radius:10px;background:none;color:var(--muted);font-size:18px;}
  .empty-msg{color:var(--muted);font-size:14px;text-align:center;padding:32px 0;}

  .done-btn{flex-shrink:0;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;background:var(--chore);color:#26200E;}
  .done-btn:active{background:var(--chore-dim);color:var(--text);}

  .section-title{font-size:13px;color:var(--muted);font-weight:600;margin:24px 0 10px;}
  form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;appearance:none;}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .hybrid-input{margin-top:8px;display:none;}
  .form-note{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.6;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips:not(:empty){margin-bottom:10px;}
  .chip{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;}
  .chip.on{border-color:var(--stock);background:var(--stock-dim);color:var(--text);}
  #finance-panel .chip.on,#tm-backdrop[data-sheet="finance"] .chip.on{border-color:var(--finance);background:var(--finance-dim);}
  .label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .label-row label{margin:0 !important;}
  .text-btn{background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;padding:4px 2px;}
  .label-row .text-btn{color:var(--stock);}
  #finance-panel .label-row .text-btn{color:var(--finance);}

  /* タグ管理シート */
  .sheet.tall{height:85%;display:flex;flex-direction:column;padding-bottom:calc(14px + var(--safe-bottom));}
  .tm-head{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;margin-bottom:12px;}
  .tm-head h2{margin:0;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tm-head .text-btn:last-child{justify-self:end;}
  .tm-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .tm-foot:not(:empty){padding-top:12px;}
  .tm-row{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;color:var(--text);font-size:15px;font-weight:600;text-align:left;}
  .tm-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tm-row .count{font-size:12px;color:var(--muted);font-weight:500;}
  .tm-row .chev{color:var(--muted);}
  .tm-section{margin-bottom:22px;}
  .tm-section h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;}
  .tm-inline{display:flex;gap:8px;}
  .tm-inline input{flex:1;min-width:0;}
  .tm-btn{flex-shrink:0;border:none;border-radius:10px;padding:0 16px;font-size:14px;font-weight:700;background:var(--text);color:var(--bg);}
  .tm-btn:disabled{opacity:.4;}
  .tm-wide{width:100%;padding:13px;}
  .tm-note{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 0;}
  .sheet .tm-lead{margin:0 0 18px;font-size:13px;}
  .tm-month{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;}
  .tm-month:first-child{margin-top:0;}
  .tm-check{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:6px;}
  .tm-check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--stock);}
  #tm-backdrop[data-sheet="finance"] .tm-check input{accent-color:var(--finance);}
  .tm-check.done{opacity:.5;}
  .tm-check .main{flex:1;min-width:0;}
  .tm-check .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tm-check .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  details{border-top:1px solid var(--border);margin:6px 0 12px;}
  summary{display:block;padding:12px 0;font-size:13px;color:var(--muted);cursor:pointer;list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary:before{content:"▸ ";}
  details[open] summary:before{content:"▾ ";}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .submit-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;margin-top:4px;color:#0B1210;}
  #stock-panel .submit-btn{background:var(--stock);}
  #finance-panel .submit-btn{background:var(--finance);}
  #chore-panel .submit-btn{background:var(--chore);}
  .submit-btn:active{opacity:.8;}

  nav.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(24,31,35,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:0 8px var(--safe-bottom);}
  nav.tabbar button{position:relative;flex:1;height:49px;background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:0;display:flex;align-items:center;justify-content:center;}
  nav.tabbar button .dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:transparent;}
  nav.tabbar button.active{color:var(--text);}
  nav.tabbar button[data-tab="stock"].active .dot{background:var(--stock);}
  nav.tabbar button[data-tab="finance"].active .dot{background:var(--finance);}
  nav.tabbar button[data-tab="chore"].active .dot{background:var(--chore);}

  .list-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;}
  /* タグの絞り込み：一覧の上は「絞り込み」ボタン・選択中のタグ・「管理」ボタンの1行 */
  .filter-bar{display:flex;align-items:center;gap:8px;margin:0 0 12px;}
  .filter-bar:empty{display:none;}
  .filter-open,.filter-manage{flex-shrink:0;border:1px solid var(--border);background:none;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;}
  .filter-chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0;}
  .filter-chips::-webkit-scrollbar{display:none;}
  .filter-chips .chip{flex-shrink:0;padding:5px 10px;font-size:12px;}
  .filter-status{display:flex;align-items:center;gap:4px;margin:-4px 0 12px;font-size:12px;color:var(--muted);}
  .filter-status:empty{display:none;}
  .filter-status .clear{margin-left:auto;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:4px 0;}
  #stock-panel .filter-manage,#stock-panel .filter-open.on{color:var(--stock);border-color:var(--stock);}
  #finance-panel .filter-manage,#finance-panel .filter-open.on{color:var(--finance);border-color:var(--finance);}
  #stock-panel .filter-manage,#finance-panel .filter-manage{border-color:var(--border);}
  /* 絞り込みパネル：タグを折り返して並べる */
  .filter-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .filter-search{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:16px;appearance:none;}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;}
  .seg button{flex:1;border:none;background:none;color:var(--muted);border-radius:7px;padding:8px 0;font-size:13px;font-weight:700;}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4);}
  .filter-cloud{margin-bottom:16px;}
  .filter-actions{display:flex;gap:8px;}
  .filter-actions .cancel-btn{margin-top:0;}

  /* 登録パネル：一覧を見ながら入力できるよう、タブバーの上に半分ほどの高さで重ねる */
  :root{--tabbar-h:calc(49px + var(--safe-bottom));--compose-pad:0px;}
  .compose{position:fixed;left:0;right:0;bottom:var(--tabbar-h);height:var(--compose-h,55%);max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);display:none;flex-direction:column;z-index:5;}
  body[data-compose="form"] .tab-panel.active .compose[data-kind="form"],
  body[data-compose="filter"] .tab-panel.active .compose[data-kind="filter"]{display:flex;}
  .compose-grip{flex-shrink:0;height:24px;display:flex;align-items:center;justify-content:center;}
  /* つまみ・タイトル・説明文の行はドラッグで高さを変える領域。スクロールやズームに取られないようにする */
  .compose-grip,.compose-head,.compose-hint{touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none;}
  .compose-grip span{width:40px;height:5px;border-radius:3px;background:var(--border);}
  .compose-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;}
  .compose-head:has(+ .compose-hint){padding-bottom:0;}
  .compose-head h2{margin:0;font-size:16px;}
  .compose-hint{flex-shrink:0;margin:0;padding:4px 16px 10px;font-size:12px;color:var(--muted);}
  .compose-body{flex:1;overflow-y:auto;border-top:1px solid var(--border);-webkit-overflow-scrolling:touch;padding:12px 16px 16px;}
  .compose form{background:none;border:none;border-radius:0;padding:0;}
  main{padding-bottom:calc(96px + var(--safe-bottom) + var(--compose-pad));}
  .fab{position:fixed;right:16px;bottom:calc(var(--tabbar-h) + 16px);z-index:4;border:none;border-radius:999px;padding:13px 20px;font-size:15px;font-weight:700;color:#0B1210;box-shadow:0 6px 18px rgba(0,0,0,.45);}
  .tab-panel:not(.active) .fab, body[data-compose] .fab{display:none;}
  #stock-panel .fab{background:var(--stock);}
  #finance-panel .fab{background:var(--finance);}
  #chore-panel .fab{background:var(--chore);}
  /* 登録パネルが開いている間、一覧のタップで入力できることを示す */
  body[data-compose="form"] #stock-panel .card-info, body[data-compose="form"] #finance-panel .fin-row{cursor:copy;}
  .picked{animation:picked .6s ease-out;}
  @keyframes picked{from{box-shadow:0 0 0 2px var(--text);}to{box-shadow:0 0 0 2px transparent;}}

  /* 家計簿の履歴 */
  .fin-month{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:var(--muted);margin:18px 2px 8px;}
  .fin-month:first-child{margin-top:0;}
  .fin-month .sum{font-size:13px;color:var(--text);}
  .fin-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:8px;}
  .fin-date{flex-shrink:0;width:38px;font-size:12px;color:var(--muted);text-align:center;line-height:1.3;}
  .fin-date b{display:block;font-size:16px;color:var(--text);}
  .fin-main{flex:1;min-width:0;}
  .fin-cat{font-size:15px;font-weight:600;}
  .fin-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fin-amount{flex-shrink:0;font-size:16px;font-weight:700;}
  .fin-row{cursor:pointer;}
  .tm-danger{margin-top:28px;padding-top:18px;border-top:1px solid var(--border);}
  .list-head .section-title{margin:0;}
  .edit-toggle{background:none;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;}
  .edit-toggle.on{border-color:var(--danger);color:var(--danger);}
  .delete-btn{flex-shrink:0;border:1px solid var(--danger);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;background:none;color:var(--danger);}
  .delete-btn:active{background:var(--danger-dim);}

  #sheet-backdrop,#tm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10;}
  #sheet-backdrop.show,#tm-backdrop.show{display:flex;}
  .sheet{width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + var(--safe-bottom));}
  .sheet h2{margin:0 0 6px;font-size:17px;}
  .sheet .sheet-name{font-size:15px;font-weight:700;color:var(--danger);word-break:break-all;}
  .sheet p{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.6;}
  .sheet .warn{color:var(--chore);}
  .hold-btn{position:relative;overflow:hidden;width:100%;margin-top:18px;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;background:var(--danger-dim);color:var(--text);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;}
  .hold-btn .fill{position:absolute;inset:0;background:var(--danger);transform:scaleX(0);transform-origin:left;transition:transform .2s ease-out;}
  .hold-btn.holding .fill{transform:scaleX(1);transition:transform 1.5s linear;}
  .hold-btn span{position:relative;}
  .hold-btn:disabled{opacity:.6;}
  .cancel-btn{width:100%;margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:13px;font-size:15px;font-weight:600;background:none;color:var(--text);}

  #toast{position:fixed;z-index:20;left:50%;bottom:calc(90px + var(--safe-bottom) + var(--compose-pad));transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="app-bar">
      <div class="brand"><img src="apple-touch-icon.png" alt="">くらしログ</div>
      <button type="button" id="reload-btn" class="icon-btn" aria-label="最新版を読み込む">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
    <h1 id="page-title">在庫管理</h1>
    <p id="page-sub">商品名をタップで編集・＋−で数量を更新</p>
  </header>

  <main>
    <!-- ===== 在庫タブ ===== -->
    <section id="stock-panel" class="tab-panel active">
      <div class="list-head">
        <div class="section-title">登録中の商品</div>
        <button type="button" id="stock-edit-toggle" class="edit-toggle">整理</button>
      </div>
      <div class="filter-bar" id="stock-filter"></div>
      <div id="stock-list"><p class="empty-msg">読み込み中…</p></div>

      <button type="button" class="fab" data-compose="stock">＋ 登録</button>
      <div class="compose" data-kind="form" id="stock-compose" role="dialog" aria-labelledby="stock-compose-title">
        <div class="compose-grip" aria-hidden="true"><span></span></div>
        <div class="compose-head">
          <h2 id="stock-compose-title">新しく登録する</h2>
          <button type="button" class="text-btn compose-close">閉じる</button>
        </div>
        <p class="compose-hint">一覧の商品をタップすると、商品名・収納場所・タグを入力できます</p>
        <div class="compose-body">
          <form id="stock-form">
            <div class="field"><label>商品名</label><input type="text" id="s-name" required placeholder="例：ティッシュ"></div>
            <div class="row2"><div class="field"><label>個数</label><input type="number" id="s-value" required value="1" inputmode="numeric"></div></div>
            <div class="field"><label>収納場所</label>
              <select id="s-location-select" class="hybrid-select"></select>
              <input type="text" id="s-location-input" class="hybrid-input" placeholder="新しい収納場所を入力">
            </div>
            <div class="field"><div class="label-row"><label>タグ（複数選択可）</label><button type="button" class="text-btn" data-tag-manage="stock">管理</button></div>
              <div id="s-tags-chips" class="chips"></div>
              <input type="text" id="s-tags-input" placeholder="新しいタグを追加（カンマ区切り可）">
            </div>
            <details>
              <summary>賞味期限・型番（任意）</summary>
              <div class="field" style="margin-top:10px;"><label>賞味期限</label><input type="date" id="s-expiration"><p class="form-note">登録済みの商品名で登録すると、賞味期限が同じなら個数を足し、違えば期限ごとに分けて管理します。</p></div>

<div id="toast"></div>

<script>
/* ▼▼▼ ここにデプロイしたGASのウェブアプリURLを貼り付けてください ▼▼▼ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbzCsng8oDxwQnSnUlxz1m3ANECSSH1tkmK1GIhowAkyhAM_ao7BydA1venB-zGssbL1/exec";
/* ▲▲▲ 例: https://script.google.com/macros/s/xxxxx/exec ▲▲▲ */

let stockCache = [];
let choreCache = [];

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

function postToGas(payload){
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(r => r.json());
}

function setupHybrid(selectEl, inputEl, presetValues){
  selectEl.innerHTML = '';
  presetValues.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    selectEl.appendChild(opt);
  });
  const blank = document.createElement('option');
  blank.value=''; blank.textContent='（未選択）';
  selectEl.insertBefore(blank, selectEl.firstChild);
  const newOpt = document.createElement('option');
  newOpt.value='__new__'; newOpt.textContent='＋ 新規入力';
  selectEl.appendChild(newOpt);
  selectEl.value = ''; // 先頭の候補が自動選択されないよう「（未選択）」にする
  inputEl.style.display = 'none';
  selectEl.onchange = () => {
    if(selectEl.value === '__new__'){ inputEl.style.display='block'; inputEl.value=''; inputEl.focus(); }
    else { inputEl.style.display='none'; }
  };
}
function getHybridValue(selectEl, inputEl){
  return selectEl.value === '__new__' ? inputEl.value.trim() : selectEl.value;
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- タブ切り替え ----------
const TAB_INFO = {
  stock:{title:'在庫管理', sub:'商品名をタップで編集・＋−で数量を更新'},
  finance:{title:'家計簿', sub:'記録をタップで編集・削除'},
  chore:{title:'家事ルーティン', sub:'今日やる家事はこれ'}
};
document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(stockEditMode) setStockEditMode(false);
    closeCompose();
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById(tab + '-panel').classList.add('active');
    document.getElementById('page-title').textContent = TAB_INFO[tab].title;
    document.getElementById('page-sub').textContent = TAB_INFO[tab].sub;
  });
});
// ---------- 下から出るパネル（登録フォーム・タグの絞り込み） ----------
// 「＋ 登録」や「絞り込み」で開き、一覧の上に重ねて表示する。上端のつまみをドラッグして高さを変えられる
// body の data-compose に開いているパネルの種類（form / filter）を入れる
let composeHeight = null; // ドラッグで変えた高さ（px）。未設定なら表示領域の55%
function openPanelKind(){ return document.body.dataset.compose || ''; }
// 登録フォームが開いているか（一覧のタップでフォームに入力するかの判定に使う）
function isComposing(){ return openPanelKind() === 'form'; }
function activeCompose(){
  const kind = openPanelKind();
  return kind ? document.querySelector(`.tab-panel.active .compose[data-kind="${kind}"]`) : null;
}
function applyComposeHeight(){
  const root = document.documentElement.style;
  if(!openPanelKind()){ root.setProperty('--compose-pad', '0px'); return; }
  if(composeHeight) root.setProperty('--compose-h', composeHeight + 'px');
  // 一覧の最後まで見られるよう、パネルの高さ分だけ一覧の下に余白を足す
  const panel = activeCompose();
  if(panel) root.setProperty('--compose-pad', panel.getBoundingClientRect().height + 'px');
}
function openCompose(kind = 'form'){
  document.body.dataset.compose = kind;
  applyComposeHeight();
}
function closeCompose(){
  delete document.body.dataset.compose;
  applyComposeHeight();
}
document.querySelectorAll('.fab').forEach(b=>b.addEventListener('click', ()=>openCompose('form')));
document.querySelectorAll('.compose-close').forEach(b=>b.addEventListener('click', closeCompose));
// つまみだけでなく、タイトルと説明文の行（ヘッダー部分）全体をドラッグして高さを変えられるようにする
function enableComposeDrag(panel){
  const areas = panel.querySelectorAll('.compose-grip, .compose-head, .compose-hint');
  let startY = null, startH, pointerId;
  const onDown = e=>{
    if(e.target.closest('button')) return; // 「閉じる」ボタンはタップとして扱う
    startY = e.clientY;
    startH = panel.getBoundingClientRect().height;
    pointerId = e.pointerId;
    try { e.currentTarget.setPointerCapture(pointerId); } catch(_){} // 指が領域の外に出てもドラッグを続ける
  };
  const onMove = e=>{
    if(startY == null || e.pointerId !== pointerId) return;
    const navTop = document.querySelector('nav.tabbar').getBoundingClientRect().top;
    const max = navTop - 80; // ヘッダー付近までは広げられる
    composeHeight = Math.round(Math.min(max, Math.max(160, startH + (startY - e.clientY))));
    applyComposeHeight();
  };
  const onEnd = e=>{
    if(startY == null || e.pointerId !== pointerId) return;
    // 下まで引き下げたら閉じる
    if(startH + (startY - e.clientY) < 120){ composeHeight = null; document.documentElement.style.removeProperty('--compose-h'); closeCompose(); }
    startY = null;
  };
  areas.forEach(el=>{
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onEnd);
    el.addEventListener('pointercancel', onEnd);
  });
}
document.querySelectorAll('.compose').forEach(enableComposeDrag);
window.addEventListener('resize', applyComposeHeight);
// 一覧をタップしてフォームに入力したことを、カードの枠とトーストで知らせる
function flashPicked(el, label){
  el.classList.remove('picked');
  void el.offsetWidth;
  el.classList.add('picked');
  toast(`「${label}」を入力しました`);
}
// プルダウン＋新規入力の組み合わせに値を入れる（候補になければ新規入力欄に入れる）
function setHybridValue(selectEl, inputEl, v){
  v = String(v || '').trim();
  const has = [...selectEl.options].some(o=>o.value === v && v !== '__new__');
  if(!v || has){ selectEl.value = v; inputEl.style.display = 'none'; }
  else { selectEl.value = '__new__'; inputEl.style.display = 'block'; inputEl.value = v; }
}

// 最新版の読み込み：キャッシュを使わずにページを取り直してキャッシュを上書きし、再読み込みする
document.getElementById('reload-btn').addEventListener('click', e=>{
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.classList.add('spinning');
  fetch(location.href.split('#')[0], {cache:'reload'})
    .catch(()=>{})
    .finally(()=>location.reload());
});

// ---------- 在庫 ----------
// 在庫は1行＝1ロット（賞味期限ごと）。画面では商品名ごとにまとめて表示する
function groupStock(){
  const map = new Map();
  stockCache.forEach(r=>{
    const name = String(r.itemName);
    if(!map.has(name)) map.set(name, []);
    map.get(name).push(r);
  });
  // 期限の早い順（期限なしは最後）
  const expKey = r=>toDateInputValue(r.expirationDate) || '9999-99-99';
  return [...map.entries()].map(([name, lots])=>{
    lots.sort((a,b)=>expKey(a).localeCompare(expKey(b)));
    const pick = key=>(lots.find(l=>l[key]) || {})[key] || '';
    return {name, lots, location:pick('location'), tags:pick('tags'), modelNumber:pick('modelNumber')};
  });
}
// 期限の表示（「期限 10/5」）と、3日以内・期限切れの判定
function expInfo(lot){
  const exp = toDateInputValue(lot.expirationDate);
  if(!exp) return {label:'', cls:''};
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((new Date(exp + 'T00:00:00') - today) / 86400000);
  return {label:`期限 ${Number(exp.slice(5,7))}/${Number(exp.slice(8,10))}`, cls: days < 0 ? 'expired' : days <= 3 ? 'soon' : ''};
}
function renderStockList(){
  const wrap = document.getElementById('stock-list');
  if(!stockCache.length){ wrap.innerHTML = '<p class="empty-msg">まだ登録された商品がありません</p>'; return; }
  wrap.innerHTML = '';
  const groups = groupStock().filter(g=>stockFilter.matches(g.tags));
  if(stockFilter.active()) stockFilter.setCount(`${groups.length}件`);
  if(!groups.length){ wrap.innerHTML = '<p class="empty-msg">該当する商品がありません</p>'; return; }
  groups.forEach(g=>{
    const single = g.lots.length === 1;
    const exp = single ? expInfo(g.lots[0]) : null;
    const meta = h('div', {class:'card-meta'});
    if(exp && exp.label) meta.append(h('span', {class:'exp ' + exp.cls}, exp.label), (g.location || g.tags) ? ' ・ ' : '');
    meta.append([g.location, splitTags(g.tags).join(', ')].filter(Boolean).join(' ・ ') || (exp && exp.label ? '' : '—'));
    const info = h('div', {class:'card-info'}, h('div', {class:'card-name'}, g.name), meta);
    const card = h('div', {class:'card' + (single ? '' : ' multi')});

    if(stockEditMode){
      card.classList.remove('multi');
      card.append(info, h('button', {type:'button', class:'delete-btn', onclick:()=>openDeleteSheet(g)}, '削除'));
      wrap.appendChild(card);
      return;
    }
    info.addEventListener('click', ()=>isComposing() ? fillStockForm(g, card) : openItemEditor(g));
    if(single){
      card.append(info, makeStepper(g.lots[0]));
    } else {
      const total = h('div', {class:'card-total'});
      const updateTotal = ()=>{ total.textContent = `計 ${g.lots.reduce((s,l)=>s + (Number(l.stock) || 0), 0)}`; };
      updateTotal();
      card.append(
        h('div', {class:'card-top'}, info, total),
        h('div', {class:'lots'}, g.lots.map(l=>{
          const e = expInfo(l);
          return h('div', {class:'lot'}, h('span', {class:'lot-exp exp ' + e.cls}, e.label || '期限なし'), makeStepper(l, updateTotal));
        }))
      );
    }
    wrap.appendChild(card);
  });
}
// ロットの個数を＋−するボタン（idで更新）
function makeStepper(lot, onChange){
  const count = h('span', {class:'count'}, String(lot.stock ?? 0));
  const bump = delta=>{
    const prev = Number(lot.stock) || 0;
    const set = v=>{ lot.stock = v; count.textContent = v; if(onChange) onChange(); };
    set(prev + delta);
    postToGas({type:'stock', action:'bump', id:lot.id, value:delta})
      .then(res=>{ if(res.status !== 'success'){ set(prev); toast(res.message || '更新に失敗しました'); } })
      .catch(()=>{ set(prev); toast('通信エラー'); });
  };
  return h('div', {class:'stepper'},
    h('button', {type:'button', onclick:()=>bump(-1)}, '−'), count, h('button', {type:'button', onclick:()=>bump(1)}, '＋'));
}
// 削除は「整理モード → 削除ボタン → 確認シートで長押し」の3段階にして誤操作を防ぐ
let stockEditMode = false;
let deleteTarget = null;
const HOLD_MS = 1500;
const editToggle = document.getElementById('stock-edit-toggle');
const sheetBackdrop = document.getElementById('sheet-backdrop');
const holdBtn = document.getElementById('hold-delete-btn');

function setStockEditMode(on){
  stockEditMode = on;
  editToggle.textContent = on ? '完了' : '整理';
  editToggle.classList.toggle('on', on);
  if(document.querySelector('nav.tabbar button.active').dataset.tab === 'stock'){
    document.getElementById('page-sub').textContent = on ? '不要になった商品を削除' : TAB_INFO.stock.sub;
  }
  renderStockList();
}
editToggle.addEventListener('click', ()=>setStockEditMode(!stockEditMode));

// 削除は商品単位（その商品の全ロット）。1つのロットだけ消すときは編集画面から
function openDeleteSheet(g){
  deleteTarget = g;
  document.getElementById('sheet-item-name').textContent = g.name;
  const stock = g.lots.reduce((s,l)=>s + (Number(l.stock) || 0), 0);
  const lotsNote = g.lots.length > 1 ? `賞味期限の異なる${g.lots.length}件をすべて削除します。` : '';
  document.getElementById('sheet-stock-warn').textContent = (stock > 0 ? `在庫がまだ ${stock} 個残っています。` : '') + lotsNote;
  holdBtn.disabled = false;
  holdBtn.querySelector('span').textContent = '長押しで削除';
  sheetBackdrop.classList.add('show');
}
function closeDeleteSheet(){
  cancelHold();
  deleteTarget = null;
  sheetBackdrop.classList.remove('show');
}
document.getElementById('sheet-cancel-btn').addEventListener('click', closeDeleteSheet);
sheetBackdrop.addEventListener('click', e=>{ if(e.target === sheetBackdrop && !holdBtn.disabled) closeDeleteSheet(); });

function startHold(e){
  if(holdBtn.disabled || !deleteTarget) return;
  e.preventDefault();
  holdBtn.classList.add('holding');
  clearTimeout(startHold._t);
  startHold._t = setTimeout(executeDelete, HOLD_MS);
}
function cancelHold(){
  clearTimeout(startHold._t);
  holdBtn.classList.remove('holding');
}
holdBtn.addEventListener('pointerdown', startHold);
['pointerup','pointerleave','pointercancel'].forEach(ev=>holdBtn.addEventListener(ev, cancelHold));
holdBtn.addEventListener('contextmenu', e=>e.preventDefault());

function executeDelete(){
  const g = deleteTarget;
  if(!g) return;
  holdBtn.disabled = true;
  holdBtn.querySelector('span').textContent = '削除中…';
  postToGas({type:'stock', action:'delete', target:g.name})
    .then(res=>{
      if(res.status === 'success'){
        stockCache = stockCache.filter(r=>String(r.itemName) !== g.name);
        closeDeleteSheet();
        renderStockList();
        toast(`「${g.name}」を削除しました`);
      } else {
        cancelHold(); holdBtn.disabled = false; holdBtn.querySelector('span').textContent = '長押しで削除';
        toast(res.message || '削除に失敗しました');
      }
    })
    .catch(()=>{
      cancelHold(); holdBtn.disabled = false; holdBtn.querySelector('span').textContent = '長押しで削除';
      toast('通信エラー');
    });
}

// タグ文字列を配列に分解（「,」のほか全角の「，」「、」も区切りとして扱う）
function splitTags(s){
  return String(s ?? '').split(/[,，、]/).map(t=>t.trim()).filter(Boolean);
}
// 重複と空欄を除いて五十音順に並べる
function uniqSorted(values){
  return [...new Set(values.map(v=>String(v ?? '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
}
// タグのチップ選択（複数選択）＋新規タグ入力欄
function createTagPicker(chipsId, inputId){
  const wrap = document.getElementById(chipsId);
  const input = document.getElementById(inputId);
  const selected = new Set();
  return {
    render(tags){
      // 名称変更・削除で無くなったタグは選択状態からも外す
      [...selected].forEach(t=>{ if(!tags.includes(t)) selected.delete(t); });
      wrap.innerHTML = '';
      tags.forEach(tag=>{
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (selected.has(tag) ? ' on' : '');
        chip.textContent = tag;
        chip.addEventListener('click', ()=>{
          if(selected.has(tag)) selected.delete(tag); else selected.add(tag);
          chip.classList.toggle('on', selected.has(tag));
        });
        wrap.appendChild(chip);
      });
    },
    // render の前に呼ぶと、そのタグを選択済みの状態で表示する
    select(tag){ selected.add(tag); },
    // 選択中のタグを入れ替える（一覧のタップでフォームに入力するとき用）
    set(tags){
      // 候補のチップにないタグは、選択状態が見えなくならないよう新規入力欄に入れる
      const shown = new Set([...wrap.querySelectorAll('.chip')].map(c=>c.textContent));
      selected.clear();
      tags.filter(t=>shown.has(t)).forEach(t=>selected.add(t));
      input.value = tags.filter(t=>!shown.has(t)).join(',');
      wrap.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', selected.has(c.textContent)));
    },
    // 選択中のタグと新規入力のタグを「,」区切りの文字列にする
    value(){
      return [...new Set([...selected, ...splitTags(input.value)])].join(',');
    },
    clear(){
      selected.clear();
      input.value = '';
      wrap.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
    }
  };
}
// タグの絞り込み
// 一覧の上には「絞り込み」ボタンと選択中のタグだけを出し、タグの一覧は下から出るパネルに折り返して並べる
// パネルは一覧に重ねて表示するので、選ぶとすぐ上の一覧に結果が反映される
function createFilterBar(barId, sheet, onChange){
  const bar = document.getElementById(barId);
  const section = bar.closest('.tab-panel');
  const status = h('div', {class:'filter-status'});
  bar.after(status);
  const selected = new Set();
  let mode = 'any';
  let tags = [];

  // ---- パネル ----
  const search = h('input', {type:'search', class:'filter-search', placeholder:'タグを検索', oninput:()=>drawPanel()});
  const modeSeg = h('div', {class:'seg'});
  const cloud = h('div', {class:'chips filter-cloud'});
  const panel = h('div', {class:'compose', role:'dialog'},
    h('div', {class:'compose-grip'}, h('span')),
    h('div', {class:'compose-head'},
      h('h2', {}, 'タグで絞り込む'),
      h('button', {type:'button', class:'text-btn', onclick:closeCompose}, '閉じる')),
    h('p', {class:'compose-hint'}, '選んだタグの付いたデータだけを一覧に表示します'),
    h('div', {class:'compose-body'},
      h('div', {class:'filter-tools'}, search, modeSeg),
      cloud,
      h('div', {class:'filter-actions'},
        h('button', {type:'button', class:'cancel-btn', onclick:()=>{ selected.clear(); changed(); }}, '選択をすべて解除'),
        h('button', {type:'button', class:'cancel-btn', onclick:()=>{ closeCompose(); openTagManager(sheet); }}, 'タグを管理'))));
  panel.dataset.kind = 'filter';
  section.append(panel);
  enableComposeDrag(panel);

  const changed = ()=>{ draw(); onChange(); };
  function drawPanel(){
    modeSeg.innerHTML = '';
    [['any', 'いずれかを含む'], ['all', 'すべてを含む']].forEach(([m, label])=>modeSeg.append(
      h('button', {type:'button', class: mode === m ? 'on' : '', onclick:()=>{ if(mode !== m){ mode = m; changed(); } }}, label)));
    cloud.innerHTML = '';
    const q = search.value.trim().toLowerCase();
    const shown = tags.filter(t=>!q || t.toLowerCase().includes(q));
    if(!shown.length) cloud.append(h('p', {class:'tm-note'}, tags.length ? '該当するタグがありません' : 'タグはまだありません'));
    shown.forEach(t=>cloud.append(h('button', {type:'button', class:'chip' + (selected.has(t) ? ' on' : ''), onclick:()=>{
      if(selected.has(t)) selected.delete(t); else selected.add(t);
      changed();
    }}, t)));
  }
  // ---- 一覧の上のバー ----
  function drawBar(){
    bar.innerHTML = '';
    const open = h('button', {type:'button', class:'filter-open' + (selected.size ? ' on' : ''), onclick:()=>openCompose('filter')},
      selected.size ? `絞り込み（${selected.size}）` : '絞り込み');
    // 選択中のタグは×付きで並べ、タップで外せるようにする
    const chips = h('div', {class:'filter-chips'});
    [...selected].forEach(t=>chips.append(h('button', {type:'button', class:'chip on', onclick:()=>{ selected.delete(t); changed(); }}, `${t} ×`)));
    bar.append(open, chips, h('button', {type:'button', class:'filter-manage', onclick:()=>openTagManager(sheet)}, '管理'));
    status.innerHTML = '';
    if(selected.size){
      status.append(h('span', {class:'count'}),
        selected.size > 1 ? h('span', {}, mode === 'any' ? '・いずれかを含む' : '・すべてを含む') : '',
        h('button', {type:'button', class:'clear', onclick:()=>{ selected.clear(); changed(); }}, '絞り込みを解除'));
    }
  }
  function draw(){ drawBar(); drawPanel(); }

  return {
    // タグ一覧を描き直す。名称変更・削除で無くなったタグは選択から外し、絞り込みを更新する
    render(list){
      tags = list;
      const before = selected.size;
      [...selected].forEach(t=>{ if(!tags.includes(t)) selected.delete(t); });
      draw();
      if(selected.size !== before) onChange();
    },
    active(){ return selected.size > 0; },
    matches(tagStr){
      if(!selected.size) return true;
      const t = splitTags(tagStr);
      return mode === 'all' ? [...selected].every(x=>t.includes(x)) : [...selected].some(x=>t.includes(x));
    },
    query(){ return selected.size ? `&tags=${encodeURIComponent([...selected].join(','))}&mode=${mode}` : ''; },
    // 絞り込み結果の件数を表示する
    setCount(text){ const el = status.querySelector('.count'); if(el) el.textContent = text; }
  };
}

const stockTagPicker = createTagPicker('s-tags-chips', 's-tags-input');

function loadStock(){
  return fetch(`${GAS_URL}?action=getStock&t=${Date.now()}`)
    .then(r=>r.json())
    .then(rows=>{
      stockCache = rows;
      renderStockList();
      // 収納場所・タグの候補はスプレッドシートに登録済みの値から作る
      setupHybrid(document.getElementById('s-location-select'), document.getElementById('s-location-input'), uniqSorted(rows.map(r=>r.location)));
      stockTagPicker.render(uniqSorted(rows.flatMap(r=>splitTags(r.tags))));
      stockFilter.render(uniqSorted(rows.flatMap(r=>splitTags(r.tags))));
    })
    .catch(()=>{ document.getElementById('stock-list').innerHTML = '<p class="empty-msg">読み込みに失敗しました</p>'; });
}

  e.preventDefault();

// 家計簿の履歴：新しい順に30件ずつ読み込み、月ごとの見出しに合計を出す
const FIN_PAGE = 30;
const fin = {offset:0, total:0, lastMonth:null, monthTotals:{}, seq:0};
function loadFinanceHistory(append){
  const wrap = document.getElementById('finance-list');
  const seq = append ? fin.seq : ++fin.seq; // 読み込み直しの途中で古い応答が混ざらないようにする
  if(!append){ fin.offset = 0; fin.lastMonth = null; }
  const status = h('p', {class:'empty-msg'}, '読み込み中…');
  wrap.querySelector('.more-btn')?.remove();
  if(!append) wrap.innerHTML = '';
  wrap.append(status);
  return fetch(`${GAS_URL}?action=getFinance&offset=${fin.offset}&limit=${FIN_PAGE}${financeFilter.query()}&t=${Date.now()}`)
    .then(r=>r.json())
    .then(data=>{
      if(seq !== fin.seq) return;
      status.remove();
      fin.total = data.total;
      if(financeFilter.active()) financeFilter.setCount(`${data.total}件`);
      fin.monthTotals = data.monthTotals || {};
      if(!data.total){ wrap.append(h('p', {class:'empty-msg'}, financeFilter.active() ? '該当する記録がありません' : 'まだ記録がありません')); return; }
      data.rows.forEach(r=>{
        const d = finDay(r);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}`;
        if(key !== fin.lastMonth){
          const sum = fin.monthTotals[key];
          wrap.append(h('div', {class:'fin-month'},
            h('span', {}, `${d.getFullYear()}年${d.getMonth() + 1}月`),
            sum != null ? h('span', {class:'sum'}, `合計 ¥${Number(sum).toLocaleString()}`) : ''));
          fin.lastMonth = key;
        }
        const tags = splitTags(r.tags);
        const row = h('div', {class:'fin-row'},
          h('div', {class:'fin-date'}, h('b', {}, String(d.getDate())), '日'),
          h('div', {class:'fin-main'},
            h('div', {class:'fin-cat'}, r.category || '—'),
            h('div', {class:'fin-sub'}, [r.memo, tags.join(', ')].filter(Boolean).join(' ・ ') || 'メモなし')),
          h('div', {class:'fin-amount'}, `¥${(Number(r.amount) || 0).toLocaleString()}`));
        row.addEventListener('click', ()=>isComposing() ? fillFinanceForm(r, row) : openFinanceDetail(r));
        wrap.append(row);
      });
      fin.offset += data.rows.length;
      if(fin.offset < fin.total){
        wrap.append(h('button', {type:'button', class:'cancel-btn more-btn', onclick:()=>loadFinanceHistory(true)},
          `さらに${FIN_PAGE}件読み込む（残り${fin.total - fin.offset}件）`));
      }
    })
    .catch(()=>{ if(seq === fin.seq) status.textContent = '読み込みに失敗しました'; });
}
// 記録の支出日。GASが日本時間で計算した day（yyyy-MM-dd）を優先する
function finDay(r){
  return r.day ? new Date(r.day + 'T00:00:00') : new Date(r.date);
}
// パネルを閉じているときに履歴をタップすると、詳細と削除の画面を開く

  tm.stack = [];
  tmBackdrop.dataset.sheet = 'finance';
  tmBackdrop.classList.add('show');
  tmShow(tmFinanceView, r);
}
// 記録の編集：日付・カテゴリ・金額・メモ・タグを変更して保存する。下に削除ボタン
function tmFinanceView(r){
  tmTitle.textContent = '記録を編集';
  const field = (label, ...inputs)=>h('div', {class:'field'}, h('label', {}, label), inputs);
  const d = finDay(r);
  const date = h('input', {type:'date', value:`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`});
  const catSelect = h('select');
  const catInput = h('input', {type:'text', class:'hybrid-input', placeholder:'新しいカテゴリを入力'});
  setupHybrid(catSelect, catInput, uniqSorted(financeOpts.categories || []));
  setHybridValue(catSelect, catInput, r.category);
  const amount = h('input', {type:'number', value:Number(r.amount) || 0, inputMode:'numeric'});
  const memo = h('input', {type:'text', value:r.memo || '', placeholder:'例：スーパー'});
  const chips = h('div', {class:'chips', id:'fe-tags-chips'});
  const tagInput = h('input', {type:'text', id:'fe-tags-input', placeholder:'新しいタグを追加（カンマ区切り可）'});
  const save = h('button', {type:'button', class:'tm-btn tm-wide'}, '保存');
  const created = r.createdAt ? new Date(r.createdAt) : null;

  const deleteBtn = makeHoldButton('長押しでこの記録を削除', reset=>{
    tm.busy = true;
    postToGas({type:'finance', action:'delete', row:r.row, date:r.date, createdAt:r.createdAt || ''})
      .then(res=>{
        if(res.status !== 'success') throw new Error(res.message || '削除に失敗しました');
        return Promise.all([loadFinanceHistory(), loadFinanceOptions()]);
      })
      .then(()=>{ tm.busy = false; toast('記録を削除しました'); closeTagManager(); })
      .catch(err=>{ tm.busy = false; toast(errMsg(err)); reset(); });
  });

  tmBody.append(
    field('日付', date),
    field('カテゴリ', catSelect, catInput),
    field('金額（円）', amount),
    field('メモ', memo),
    field('タグ（複数選択可）', chips, tagInput),
    created && !isNaN(created)
      ? h('p', {class:'tm-note'}, `登録日時：${created.toLocaleString('ja-JP', {year:'numeric', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}`)
      : '',
    h('div', {class:'tm-section tm-danger'},
      h('h3', {}, '削除'),
      h('p', {class:'tm-note'}, 'スプレッドシートからこの記録の行が削除されます。元に戻すことはできません。'),
      deleteBtn)
  );
  tmFoot.append(save);

  // タグ候補は家計簿全体のタグ。この記録に付いているタグを選択済みにしておく
  const picker = createTagPicker('fe-tags-chips', 'fe-tags-input');
  const current = splitTags(r.tags);
  current.forEach(t=>picker.select(t));
  picker.render(uniqSorted([...(financeOpts.tags || []), ...current]));

  save.addEventListener('click', ()=>{
    const values = {
      date: date.value,
      category: getHybridValue(catSelect, catInput),
      amount: Number(amount.value) || 0,
      memo: memo.value.trim(),
      tags: picker.value()
    };
    if(!values.date){ toast('日付を入力してください'); return; }
    if(!values.category){ toast('カテゴリを選択してください'); return; }
    if(!values.amount){ toast('金額を入力してください'); return; }
    save.disabled = true;
    save.textContent = '保存中…';
    tm.busy = true;
    postToGas({type:'finance', action:'edit', row:r.row, date:r.date, createdAt:r.createdAt || '', values})
      .then(res=>{
        if(res.status !== 'success') throw new Error(res.message || '保存に失敗しました');
        return Promise.all([loadFinanceHistory(), loadFinanceOptions()]);
      })
      .then(()=>{ tm.busy = false; toast('保存しました'); closeTagManager(); })
      .catch(err=>{ tm.busy = false; toast(errMsg(err)); save.disabled = false; save.textContent = '保存'; });
  });
}

// ---------- タグ管理（在庫・家計簿） ----------
// 要素を作る小さなヘルパー。文字列の子要素はテキストとして入るのでエスケープ不要
function h(tag, props = {}, ...children){
  const el = document.createElement(tag);
  Object.entries(props).forEach(([k, v])=>{
    if(k === 'class') el.className = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if(k.includes('-')) el.setAttribute(k, v);
    else el[k] = v;
  });
  children.flat().forEach(c=>{ if(c != null && c !== false) el.append(c); });
  return el;
}
function errMsg(err){
  const m = err && err.message;
  return !m || m === 'Failed to fetch' || m === 'Load failed' ? '通信エラー' : m.replace(/^Error:\s*/, '');
}
// 長押しで実行するボタン（商品削除と同じ見た目）。onDone(reset) の reset で元に戻せる
function makeHoldButton(label, onDone){
  const span = h('span', {}, label);
  const btn = h('button', {type:'button', class:'hold-btn'}, h('div', {class:'fill'}), span);
  let timer;
  const reset = ()=>{ btn.disabled = false; btn.classList.remove('holding'); span.textContent = label; };
  const cancel = ()=>{ clearTimeout(timer); if(!btn.disabled) btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', e=>{
    if(btn.disabled) return;
    e.preventDefault();
    btn.classList.add('holding');
    timer = setTimeout(()=>{ btn.disabled = true; span.textContent = '処理中…'; onDone(reset); }, HOLD_MS);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev, cancel));
  btn.addEventListener('contextmenu', e=>e.preventDefault());
  return btn;
}

const TM_LABEL = {stock:'在庫', finance:'家計簿'};
const tm = {sheet:null, stack:[], busy:false};
const tmBackdrop = document.getElementById('tm-backdrop');
const tmBody = document.getElementById('tm-body');
const tmFoot = document.getElementById('tm-foot');
const tmTitle = document.getElementById('tm-title');
const tmBack = document.getElementById('tm-back');

function tmTagCounts(){
  if(tm.sheet === 'finance') return financeOpts.tagCounts || {};
  const counts = {};
  // 在庫は商品単位で数える（同じ商品のロットは1件）
  groupStock().forEach(g=>splitTags(g.tags).forEach(t=>counts[t] = (counts[t] || 0) + 1));
  return counts;
}
function openTagManager(sheet){
  tm.sheet = sheet;
  tm.stack = [];
  tmBackdrop.dataset.sheet = sheet;
  tmBackdrop.classList.add('show');
  tmShow(tmListView);
}
function closeTagManager(){
  if(tm.busy) return;
  tmBackdrop.classList.remove('show');
}
// 画面は「一覧 → タグ詳細 → 付与する行の選択」の順に積み重ね、「戻る」で1つ前に戻る
function tmShow(view, ...args){ tm.stack.push([view, args]); tmRender(); }
function tmRender(){
  const [view, args] = tm.stack[tm.stack.length - 1];
  tmBody.innerHTML = '';
  tmFoot.innerHTML = '';
  tmBody.scrollTop = 0;
  tmBack.style.visibility = tm.stack.length > 1 ? 'visible' : 'hidden';
  view(...args);
}
tmBack.addEventListener('click', ()=>{ if(!tm.busy && tm.stack.length > 1){ tm.stack.pop(); tmRender(); } });
document.getElementById('tm-close').addEventListener('click', closeTagManager);
tmBackdrop.addEventListener('click', e=>{ if(e.target === tmBackdrop) closeTagManager(); });
document.querySelectorAll('[data-tag-manage]').forEach(b=>b.addEventListener('click', ()=>openTagManager(b.dataset.tagManage)));

// GASでタグを一括操作し、成功したら候補とカウントを読み込み直す
function tagOp(payload){
  tm.busy = true;
  return postToGas({type:'tag', sheet:tm.sheet, ...payload})
    .then(res=>{
      if(res.status !== 'success') throw new Error(res.message || '処理に失敗しました');
      return (tm.sheet === 'stock' ? loadStock() : loadFinanceOptions()).then(()=>res);
    })
    .finally(()=>{ tm.busy = false; });
}
function hasSeparator(name){
  if(/[,，、]/.test(name)){ toast('タグ名に「,」「、」は使えません'); return true; }
  return false;
}

function tmListView(){
  tmTitle.textContent = `${TM_LABEL[tm.sheet]}のタグ`;
  const counts = tmTagCounts();
  const tags = uniqSorted(Object.keys(counts));
  const input = h('input', {type:'text', placeholder:'新しいタグ名'});
  const next = ()=>{
    const name = input.value.trim();
    if(!name || hasSeparator(name)) return;
    tmShow(counts[name] ? tmDetailView : tmAssignView, name);
  };
  tmBody.append(
    h('div', {class:'tm-section'},
      h('h3', {}, '新しいタグを作って付ける'),
      h('div', {class:'tm-inline'}, input, h('button', {type:'button', class:'tm-btn', onclick:next}, '次へ'))),
    h('div', {class:'tm-section'},
      h('h3', {}, '登録済みのタグ'),
      tags.length
        ? tags.map(t=>h('button', {type:'button', class:'tm-row', onclick:()=>tmShow(tmDetailView, t)},
            h('span', {class:'name'}, t), h('span', {class:'count'}, `${counts[t]}件`), h('span', {class:'chev'}, '›')))
        : h('p', {class:'tm-note'}, 'タグはまだありません'))
  );
}

function tmDetailView(tag){
  tmTitle.textContent = tag;
  const count = tmTagCounts()[tag] || 0;
  const input = h('input', {type:'text', value:tag});
  const renameBtn = h('button', {type:'button', class:'tm-btn', onclick:()=>{
    const newName = input.value.trim();
    if(!newName || newName === tag || hasSeparator(newName)) return;
    if(tmTagCounts()[newName] && !confirm(`「${newName}」は既にあります。「${tag}」を「${newName}」に統合しますか？`)) return;
    renameBtn.disabled = true;
    tagOp({action:'rename', tag, newName})
      .then(res=>{ toast(`${res.count}件のタグ名を変更しました`); tm.stack.pop(); tmShow(tmDetailView, newName); })
      .catch(err=>{ toast(errMsg(err)); renameBtn.disabled = false; });
  }}, '変更');
  const deleteBtn = makeHoldButton('長押しでタグを削除', reset=>{
    tagOp({action:'delete', tag})
      .then(res=>{ toast(`${res.count}件から「${tag}」を外しました`); tm.stack.pop(); tmRender(); })
      .catch(err=>{ toast(errMsg(err)); reset(); });
  });
  tmBody.append(
    h('p', {class:'tm-note tm-lead'}, `${count}件に付いています`),
    h('div', {class:'tm-section'},
      h('h3', {}, '名前を変更'),
      h('div', {class:'tm-inline'}, input, renameBtn),
      h('p', {class:'tm-note'}, '既にあるタグ名にすると、2つのタグが1つにまとめられます。')),
    h('div', {class:'tm-section'},
      h('h3', {}, 'まとめて付ける'),
      h('button', {type:'button', class:'tm-btn tm-wide', onclick:()=>tmShow(tmAssignView, tag)}, '付ける行を選ぶ')),
    h('div', {class:'tm-section'},
      h('h3', {}, '削除'),
      h('p', {class:'tm-note'}, 'すべての行からこのタグを外します。行そのものは削除されません。'),
      deleteBtn)
  );
}

function tmAssignView(tag){
  tmTitle.textContent = `「${tag}」を付ける`;
  const selected = new Map(); // key → GASに送る対象
  const submit = h('button', {type:'button', class:'tm-btn tm-wide'});
  const update = ()=>{
    submit.disabled = selected.size === 0;
    submit.textContent = selected.size ? `${selected.size}件に付ける` : '付ける行を選んでください';
  };
  submit.addEventListener('click', ()=>{
    submit.disabled = true;
    submit.textContent = '処理中…';
    tagOp({action:'assign', tag, targets:[...selected.values()]})
      .then(res=>{
        toast(`${res.count}件に「${tag}」を付けました`);
        tm.stack.pop();
        const [view, args] = tm.stack[tm.stack.length - 1];
        if(view === tmDetailView && args[0] === tag) tmRender(); else tmShow(tmDetailView, tag);
      })
      .catch(err=>{ toast(errMsg(err)); update(); });
  });
  update();
  tmFoot.append(submit);

  const makeRow = (key, target, title, sub, has)=>{
    const cb = h('input', {type:'checkbox', checked:has, disabled:has, onchange:()=>{
      if(cb.checked) selected.set(key, target); else selected.delete(key);
      update();
    }});
    return h('label', {class:'tm-check' + (has ? ' done' : '')}, cb,
      h('div', {class:'main'}, h('div', {class:'t1'}, title), h('div', {class:'t2'}, has ? '付与済み' : sub)));
  };

  if(tm.sheet === 'stock'){
    const groups = groupStock().sort((a,b)=>a.name.localeCompare(b.name, 'ja'));
    if(!groups.length){ tmBody.append(h('p', {class:'tm-note'}, '商品がありません')); return; }
    groups.forEach(g=>{
      const tags = splitTags(g.tags);
      const sub = [g.location, tags.join(', ')].filter(Boolean).join(' ・ ') || '収納場所・タグなし';
      tmBody.append(makeRow(g.name, g.name, g.name, sub, tags.includes(tag)));
    });
    return;
  }

  // 家計簿は新しい順に30件ずつ読み込み、月ごとに見出しを付ける
  const PAGE = 30;
  let offset = 0, lastMonth = null;
  const list = h('div');
  const status = h('p', {class:'tm-note'}, '読み込み中…');
  const more = h('button', {type:'button', class:'cancel-btn', onclick:()=>loadMore()});
  tmBody.append(list);
  function loadMore(){
    more.remove();
    status.textContent = '読み込み中…';
    tmBody.append(status);
    fetch(`${GAS_URL}?action=getFinance&offset=${offset}&limit=${PAGE}&t=${Date.now()}`)
      .then(r=>r.json())
      .then(data=>{
        status.remove();
        data.rows.forEach(r=>{
          const d = finDay(r);
          const month = `${d.getFullYear()}年${d.getMonth() + 1}月`;
          if(month !== lastMonth){ list.append(h('div', {class:'tm-month'}, month)); lastMonth = month; }
          const tags = splitTags(r.tags);
          const title = `${d.getMonth() + 1}/${d.getDate()}　${r.category || '—'}　¥${(Number(r.amount) || 0).toLocaleString()}`;
          const sub = [r.memo, tags.join(', ')].filter(Boolean).join(' ・ ') || 'メモ・タグなし';
          list.append(makeRow('row' + r.row, {row:r.row, date:r.date}, title, sub, tags.includes(tag)));
        });
        offset += data.rows.length;
        if(!data.total) list.append(h('p', {class:'tm-note'}, '記録がありません'));
        else if(offset < data.total){
          more.textContent = `さらに${PAGE}件読み込む（残り${data.total - offset}件）`;
          tmBody.append(more);
        }
      })
      .catch(()=>{ status.textContent = '読み込みに失敗しました'; });
  }
  loadMore();
}

// ---------- 在庫の商品編集 ----------
// シートの日付（ISO文字列や「2026/10/5」など）を <input type="date"> 用の yyyy-mm-dd にする
function toDateInputValue(v){
  if(!v) return '';
  const s = String(v);
  if(s.includes('T')){
    const d = new Date(s);
    if(isNaN(d)) return '';
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  const m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : '';
}
function openItemEditor(g){
  tm.sheet = 'stock';
  tm.stack = [];
  tmBackdrop.dataset.sheet = 'stock';
  tmBackdrop.classList.add('show');
  tmShow(tmItemView, g);
}
// 商品の編集：商品情報（全ロット共通）と、賞味期限ごとの個数（ロット）をまとめて保存する
function tmItemView(g){
  tmTitle.textContent = '商品を編集';
  const field = (label, ...inputs)=>h('div', {class:'field'}, h('label', {}, label), inputs);
  const name = h('input', {type:'text', value:g.name});
  const locSelect = h('select');
  const locInput = h('input', {type:'text', class:'hybrid-input', placeholder:'新しい収納場所を入力'});
  setupHybrid(locSelect, locInput, uniqSorted(stockCache.map(r=>r.location)));
  if(g.location) locSelect.value = g.location;
  const chips = h('div', {class:'chips', id:'e-tags-chips'});
  const tagInput = h('input', {type:'text', id:'e-tags-input', placeholder:'新しいタグを追加（カンマ区切り可）'});
  const model = h('input', {type:'text', value:g.modelNumber || ''});
  const save = h('button', {type:'button', class:'tm-btn tm-wide'}, '保存');

  // 賞味期限ごとの行。既存ロットは id を持ち、×で消すと deleteIds に入る
  const lotRows = [];
  const deleteIds = [];
  const lotList = h('div');
  const addLotRow = (lot)=>{
    const exp = h('input', {type:'date', value:lot ? toDateInputValue(lot.expirationDate) : ''});
    const count = h('input', {type:'number', value:lot ? (Number(lot.stock) || 0) : 1, inputMode:'numeric'});
    const entry = {id: lot ? lot.id : undefined, exp, count};
    const row = h('div', {class:'lot-edit'}, exp, count,
      h('button', {type:'button', class:'lot-remove', 'aria-label':'この行を削除', onclick:()=>{
        if(lotRows.length <= 1){ toast('賞味期限の行は1つ以上必要です（商品ごと消すときは「整理」から）'); return; }
        if(entry.id !== undefined) deleteIds.push(entry.id);
        lotRows.splice(lotRows.indexOf(entry), 1);
        row.remove();
      }}, '×'));
    lotRows.push(entry);
    lotList.append(row);
  };
  g.lots.forEach(addLotRow);

  tmBody.append(
    field('商品名', name),
    field('収納場所', locSelect, locInput),
    field('タグ（複数選択可）', chips, tagInput),
    field('型番', model),
    h('div', {class:'field'},
      h('div', {class:'lot-edit lot-head'}, h('label', {}, '賞味期限'), h('label', {}, '個数'), h('span')),
      lotList,
      h('button', {type:'button', class:'cancel-btn', onclick:()=>addLotRow(null)}, '＋ 賞味期限を追加'),
      h('p', {class:'tm-note'}, '賞味期限の違うものを買い足したときは、行を追加して期限ごとに個数を入れてください。'))
  );
  tmFoot.append(save);

  // タグ候補は在庫全体のタグ。この商品に付いているタグを選択済みにしておく
  const picker = createTagPicker('e-tags-chips', 'e-tags-input');
  splitTags(g.tags).forEach(t=>picker.select(t));
  picker.render(uniqSorted(stockCache.flatMap(r=>splitTags(r.tags))));

  save.addEventListener('click', ()=>{
    const itemName = name.value.trim();
    if(!itemName){ toast('商品名を入力してください'); return; }
    const lots = lotRows.map(r=>({id:r.id, expirationDate:r.exp.value, stock:Number(r.count.value) || 0}));
    const exps = lots.map(l=>l.expirationDate);
    if(new Set(exps).size !== exps.length){ toast('同じ賞味期限の行が重複しています'); return; }
    save.disabled = true;
    save.textContent = '保存中…';
    tm.busy = true;
    postToGas({
      type:'stock', action:'editItem', oldName:g.name, itemName,
      location:getHybridValue(locSelect, locInput),
      tags:picker.value(),
      modelNumber:model.value.trim(),
      lots, deleteIds
    })
      .then(res=>{
        if(res.status !== 'success') throw new Error(res.message || '保存に失敗しました');
        return loadStock();
      })
      .then(()=>{ tm.busy = false; toast('保存しました'); closeTagManager(); })
      .catch(err=>{ tm.busy = false; toast(errMsg(err)); save.disabled = false; save.textContent = '保存'; });
  });
}

// ---------- 家事 ----------
setupHybrid(document.getElementById('c-cycle-select'), document.getElementById('c-cycle-input'), []);

function renderChoreList(){
  const wrap = document.getElementById('chore-list');
  const todo = choreCache.filter(t => !(t.isDone === true || String(t.isDone).toUpperCase() === 'TRUE'));
  if(!todo.length){ wrap.innerHTML = '<p class="empty-msg">今日やる家事はありません</p>'; return; }
  wrap.innerHTML = '';
  todo.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-info">
        <div class="card-name">${escapeHtml(t.taskName)}</div>
        <div class="card-meta">${escapeHtml(t.cycle || '—')}</div>
      </div>
      <button class="done-btn" type="button">完了</button>`;
    card.querySelector('.done-btn').addEventListener('click', ()=>completeChore(t, card));
    wrap.appendChild(card);
  });
}
function completeChore(t, card){
  card.style.opacity = '0.4';
  postToGas({type:'todo', action:'done', id:t.id})
    .then(res=>{
      if(res.status === 'success'){ toast('完了しました'); t.isDone = true; renderChoreList(); }
      else { card.style.opacity='1'; toast('更新に失敗しました'); }
    }).catch(()=>{ card.style.opacity='1'; toast('通信エラー'); });
}
function loadChores(){
  fetch(`${GAS_URL}?action=getTasks&t=${Date.now()}`)
    .then(r=>r.json())
    .then(rows=>{
      choreCache = rows;
      renderChoreList();
      // 周期の候補は家事シートに登録済みの値から作る
      setupHybrid(document.getElementById('c-cycle-select'), document.getElementById('c-cycle-input'), uniqSorted(rows.map(r=>r.cycle)));
    })
    .catch(()=>{ document.getElementById('chore-list').innerHTML = '<p class="empty-msg">読み込みに失敗しました</p>'; });
}
document.getElementById('chore-form').addEventListener('submit', e=>{
  e.preventDefault();
  const taskName = document.getElementById('c-name').value.trim();
  if(!taskName) return;
  const cycle = getHybridValue(document.getElementById('c-cycle-select'), document.getElementById('c-cycle-input'));
  postToGas({type:'todo', action:'add', taskName, cycle})
    .then(res=>{
      if(res.status==='success'){ toast('登録しました'); e.target.reset(); loadChores(); }
      else toast('登録に失敗しました');
    }).catch(()=>toast('通信エラー'));
});

// ---------- 初期化 ----------
loadStock();
loadFinanceOptions();
loadFinanceHistory();
loadChores();
