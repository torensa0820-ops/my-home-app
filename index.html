<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>くらしログ</title>
<style>
  :root{
    --bg:#0F1417;
    --surface:#181F23;
    --surface-2:#1F282D;
    --border:#2A343A;
    --text:#F2F5F4;
    --muted:#8FA0A6;
    --stock:#3DDC97;
    --stock-dim:#245C43;
    --finance:#4FA3E3;
    --finance-dim:#1F4A6B;
    --chore:#F2B84B;
    --chore-dim:#7A5A1E;
    --danger:#F0616D;
    --danger-dim:#5C262B;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:calc(12px + var(--safe-top)) 20px 16px;flex-shrink:0;border-bottom:1px solid var(--border);}
  .app-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;}
  .brand img{width:22px;height:22px;border-radius:6px;}
  .icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;}
  .icon-btn:active{background:var(--surface-2);}
  .icon-btn.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  header h1{margin:0;font-size:20px;font-weight:700;}
  header p{margin:4px 0 0;font-size:13px;color:var(--muted);}
  main{flex:1;overflow-y:auto;padding:16px 16px calc(96px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .card-info{min-width:0;flex:1;}
  .card-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .stepper button{width:36px;height:36px;border-radius:10px;border:none;background:var(--surface-2);color:var(--stock);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .stepper button:active{background:var(--stock-dim);}
  .stepper .count{min-width:26px;text-align:center;font-size:17px;font-weight:700;}
  .empty-msg{color:var(--muted);font-size:14px;text-align:center;padding:32px 0;}

  .done-btn{flex-shrink:0;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;background:var(--chore);color:#26200E;}
  .done-btn:active{background:var(--chore-dim);color:var(--text);}

  .section-title{font-size:13px;color:var(--muted);font-weight:600;margin:24px 0 10px;}
  form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;appearance:none;}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .hybrid-input{margin-top:8px;display:none;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips:not(:empty){margin-bottom:10px;}
  .chip{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;}
  .chip.on{border-color:var(--stock);background:var(--stock-dim);color:var(--text);}
  #finance-panel .chip.on{border-color:var(--finance);background:var(--finance-dim);}
  .label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .label-row label{margin:0 !important;}
  .text-btn{background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;padding:4px 2px;}
  .label-row .text-btn{color:var(--stock);}
  #finance-panel .label-row .text-btn{color:var(--finance);}

  /* タグ管理シート */
  .sheet.tall{height:85%;display:flex;flex-direction:column;padding-bottom:calc(14px + var(--safe-bottom));}
  .tm-head{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;margin-bottom:12px;}
  .tm-head h2{margin:0;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tm-head .text-btn:last-child{justify-self:end;}
  .tm-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .tm-foot:not(:empty){padding-top:12px;}
  .tm-row{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;color:var(--text);font-size:15px;font-weight:600;text-align:left;}
  .tm-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tm-row .count{font-size:12px;color:var(--muted);font-weight:500;}
  .tm-row .chev{color:var(--muted);}
  .tm-section{margin-bottom:22px;}
  .tm-section h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;}
  .tm-inline{display:flex;gap:8px;}
  .tm-inline input{flex:1;min-width:0;}
  .tm-btn{flex-shrink:0;border:none;border-radius:10px;padding:0 16px;font-size:14px;font-weight:700;background:var(--text);color:var(--bg);}
  .tm-btn:disabled{opacity:.4;}
  .tm-wide{width:100%;padding:13px;}
  .tm-note{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 0;}
  .sheet .tm-lead{margin:0 0 18px;font-size:13px;}
  .tm-month{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;}
  .tm-month:first-child{margin-top:0;}
  .tm-check{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:6px;}
  .tm-check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--stock);}
  #tm-backdrop[data-sheet="finance"] .tm-check input{accent-color:var(--finance);}
  .tm-check.done{opacity:.5;}
  .tm-check .main{flex:1;min-width:0;}
  .tm-check .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tm-check .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  details{border-top:1px solid var(--border);margin:6px 0 12px;}
  summary{display:block;padding:12px 0;font-size:13px;color:var(--muted);cursor:pointer;list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary:before{content:"▸ ";}
  details[open] summary:before{content:"▾ ";}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .submit-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;margin-top:4px;color:#0B1210;}
  #stock-panel .submit-btn{background:var(--stock);}
  #finance-panel .submit-btn{background:var(--finance);}
  #chore-panel .submit-btn{background:var(--chore);}
  .submit-btn:active{opacity:.8;}

  nav.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(24,31,35,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:0 8px var(--safe-bottom);}
  nav.tabbar button{position:relative;flex:1;height:49px;background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:0;display:flex;align-items:center;justify-content:center;}
  nav.tabbar button .dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:transparent;}
  nav.tabbar button.active{color:var(--text);}
  nav.tabbar button[data-tab="stock"].active .dot{background:var(--stock);}
  nav.tabbar button[data-tab="finance"].active .dot{background:var(--finance);}
  nav.tabbar button[data-tab="chore"].active .dot{background:var(--chore);}

  .list-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;}
  .list-head .section-title{margin:0;}
  .edit-toggle{background:none;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;}
  .edit-toggle.on{border-color:var(--danger);color:var(--danger);}
  .delete-btn{flex-shrink:0;border:1px solid var(--danger);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;background:none;color:var(--danger);}
  .delete-btn:active{background:var(--danger-dim);}

  #sheet-backdrop,#tm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10;}
  #sheet-backdrop.show,#tm-backdrop.show{display:flex;}
  .sheet{width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + var(--safe-bottom));}
  .sheet h2{margin:0 0 6px;font-size:17px;}
  .sheet .sheet-name{font-size:15px;font-weight:700;color:var(--danger);word-break:break-all;}
  .sheet p{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.6;}
  .sheet .warn{color:var(--chore);}
  .hold-btn{position:relative;overflow:hidden;width:100%;margin-top:18px;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;background:var(--danger-dim);color:var(--text);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;}
  .hold-btn .fill{position:absolute;inset:0;background:var(--danger);transform:scaleX(0);transform-origin:left;transition:transform .2s ease-out;}
  .hold-btn.holding .fill{transform:scaleX(1);transition:transform 1.5s linear;}
  .hold-btn span{position:relative;}
  .hold-btn:disabled{opacity:.6;}
  .cancel-btn{width:100%;margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:13px;font-size:15px;font-weight:600;background:none;color:var(--text);}

  #toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="app-bar">
      <div class="brand"><img src="apple-touch-icon.png" alt="">くらしログ</div>
      <button type="button" id="reload-btn" class="icon-btn" aria-label="最新版を読み込む">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
    <h1 id="page-title">在庫管理</h1>
    <p id="page-sub">タップして数量を更新</p>
  </header>

  <main>
    <!-- ===== 在庫タブ ===== -->
    <section id="stock-panel" class="tab-panel active">
      <div class="list-head">
        <div class="section-title">登録中の商品</div>
        <button type="button" id="stock-edit-toggle" class="edit-toggle">整理</button>
      </div>
      <div id="stock-list"><p class="empty-msg">読み込み中…</p></div>
      <div class="section-title">新しく登録する</div>
      <form id="stock-form">
        <div class="field"><label>商品名</label><input type="text" id="s-name" required placeholder="例：ティッシュ"></div>
        <div class="row2"><div class="field"><label>個数</label><input type="number" id="s-value" required value="1" inputmode="numeric"></div></div>
        <div class="field"><label>収納場所</label>
          <select id="s-location-select" class="hybrid-select"></select>
          <input type="text" id="s-location-input" class="hybrid-input" placeholder="新しい収納場所を入力">
        </div>
        <div class="field"><div class="label-row"><label>タグ（複数選択可）</label><button type="button" class="text-btn" data-tag-manage="stock">管理</button></div>
          <div id="s-tags-chips" class="chips"></div>
          <input type="text" id="s-tags-input" placeholder="新しいタグを追加（カンマ区切り可）">
        </div>
        <details>
          <summary>賞味期限・型番（任意）</summary>
          <div class="field" style="margin-top:10px;"><label>賞味期限</label><input type="date" id="s-expiration"></div>
          <div class="field"><label>型番</label><input type="text" id="s-model" placeholder="例：EC-CT12"></div>
        </details>
        <button type="submit" class="submit-btn">この商品を登録</button>
      </form>
    </section>

    <!-- ===== 家計簿タブ ===== -->
    <section id="finance-panel" class="tab-panel">
      <div class="section-title">支出を記録する</div>
      <form id="finance-form">
        <div class="field"><label>カテゴリ</label>
          <select id="f-category-select" class="hybrid-select"></select>
          <input type="text" id="f-category-input" class="hybrid-input" placeholder="新しいカテゴリを入力">
        </div>
        <div class="field"><label>金額（円）</label><input type="number" id="f-amount" required inputmode="numeric" placeholder="850"></div>
        <div class="field"><label>メモ</label><input type="text" id="f-memo" placeholder="例：スーパー"></div>
        <div class="field"><div class="label-row"><label>タグ（複数選択可）</label><button type="button" class="text-btn" data-tag-manage="finance">管理</button></div>
          <div id="f-tags-chips" class="chips"></div>
          <input type="text" id="f-tags-input" placeholder="新しいタグを追加（カンマ区切り可）">
        </div>
        <button type="submit" class="submit-btn">記録する</button>
      </form>
    </section>

    <!-- ===== 家事タブ ===== -->
    <section id="chore-panel" class="tab-panel">
      <div id="chore-list"><p class="empty-msg">読み込み中…</p></div>
      <div class="section-title">新しい家事を登録する</div>
      <form id="chore-form">
        <div class="field"><label>家事名</label><input type="text" id="c-name" required placeholder="例：お風呂掃除"></div>
        <div class="field"><label>周期</label>
          <select id="c-cycle-select" class="hybrid-select"></select>
          <input type="text" id="c-cycle-input" class="hybrid-input" placeholder="新しい周期を入力（例：3ヶ月に1回）">
        </div>
        <button type="submit" class="submit-btn">この家事を登録</button>
      </form>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="stock" class="active"><span class="dot"></span>在庫</button>
    <button data-tab="finance"><span class="dot"></span>家計簿</button>
    <button data-tab="chore"><span class="dot"></span>家事</button>
  </nav>
</div>
<div id="sheet-backdrop">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">在庫管理から削除</h2>
    <div class="sheet-name" id="sheet-item-name"></div>
    <p id="sheet-stock-warn" class="warn"></p>
    <p>スプレッドシートからこの商品の行が削除されます。元に戻すことはできません。</p>
    <button type="button" class="hold-btn" id="hold-delete-btn"><div class="fill"></div><span>長押しで削除</span></button>
    <button type="button" class="cancel-btn" id="sheet-cancel-btn">キャンセル</button>
  </div>
</div>
<div id="tm-backdrop">
  <div class="sheet tall" role="dialog" aria-modal="true" aria-labelledby="tm-title">
    <div class="tm-head">
      <button type="button" class="text-btn" id="tm-back">‹ 戻る</button>
      <h2 id="tm-title">タグ管理</h2>
      <button type="button" class="text-btn" id="tm-close">閉じる</button>
    </div>
    <div class="tm-body" id="tm-body"></div>
    <div class="tm-foot" id="tm-foot"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ▼▼▼ ここにデプロイしたGASのウェブアプリURLを貼り付けてください ▼▼▼ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbzCsng8oDxwQnSnUlxz1m3ANECSSH1tkmK1GIhowAkyhAM_ao7BydA1venB-zGssbL1/exec";
/* ▲▲▲ 例: https://script.google.com/macros/s/xxxxx/exec ▲▲▲ */

let stockCache = [];
let choreCache = [];

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

function postToGas(payload){
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(r => r.json());
}

function setupHybrid(selectEl, inputEl, presetValues){
  selectEl.innerHTML = '';
  presetValues.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    selectEl.appendChild(opt);
  });
  const blank = document.createElement('option');
  blank.value=''; blank.textContent='（未選択）';
  selectEl.insertBefore(blank, selectEl.firstChild);
  const newOpt = document.createElement('option');
  newOpt.value='__new__'; newOpt.textContent='＋ 新規入力';
  selectEl.appendChild(newOpt);
  selectEl.value = ''; // 先頭の候補が自動選択されないよう「（未選択）」にする
  inputEl.style.display = 'none';
  selectEl.onchange = () => {
    if(selectEl.value === '__new__'){ inputEl.style.display='block'; inputEl.value=''; inputEl.focus(); }
    else { inputEl.style.display='none'; }
  };
}
function getHybridValue(selectEl, inputEl){
  return selectEl.value === '__new__' ? inputEl.value.trim() : selectEl.value;
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- タブ切り替え ----------
const TAB_INFO = {
  stock:{title:'在庫管理', sub:'タップして数量を更新'},
  finance:{title:'家計簿', sub:'支出を記録'},
  chore:{title:'家事ルーティン', sub:'今日やる家事はこれ'}
};
document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(stockEditMode) setStockEditMode(false);
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById(tab + '-panel').classList.add('active');
    document.getElementById('page-title').textContent = TAB_INFO[tab].title;
    document.getElementById('page-sub').textContent = TAB_INFO[tab].sub;
  });
});

// 最新版の読み込み：キャッシュを使わずにページを取り直してキャッシュを上書きし、再読み込みする
document.getElementById('reload-btn').addEventListener('click', e=>{
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.classList.add('spinning');
  fetch(location.href.split('#')[0], {cache:'reload'})
    .catch(()=>{})
    .finally(()=>location.reload());
});

// ---------- 在庫 ----------
function renderStockList(){
  const wrap = document.getElementById('stock-list');
  if(!stockCache.length){ wrap.innerHTML = '<p class="empty-msg">まだ登録された商品がありません</p>'; return; }
  wrap.innerHTML = '';
  stockCache.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card';
    const metaParts = [item.location, item.tags].filter(Boolean).join(' ・ ');
    const info = `
      <div class="card-info">
        <div class="card-name">${escapeHtml(item.itemName)}</div>
        <div class="card-meta">${escapeHtml(metaParts || '—')}</div>
      </div>`;
    if(stockEditMode){
      card.innerHTML = info + '<button class="delete-btn" type="button">削除</button>';
      card.querySelector('.delete-btn').addEventListener('click', ()=>openDeleteSheet(item));
      wrap.appendChild(card);
      return;
    }
    card.innerHTML = info + `
      <div class="stepper">
        <button data-action="minus" type="button">−</button>
        <span class="count">${item.stock ?? 0}</span>
        <button data-action="plus" type="button">＋</button>
      </div>`;
    const countEl = card.querySelector('.count');
    card.querySelector('[data-action="minus"]').addEventListener('click', ()=>bumpStock(item,-1,countEl));
    card.querySelector('[data-action="plus"]').addEventListener('click', ()=>bumpStock(item,1,countEl));
    wrap.appendChild(card);
  });
}
function bumpStock(item, delta, countEl){
  const prev = Number(item.stock) || 0;
  item.stock = prev + delta;
  countEl.textContent = item.stock;
  postToGas({type:'stock', target:item.itemName, value:delta, location:'', tags:'', expirationDate:'', modelNumber:''})
    .then(res=>{ if(res.status !== 'success'){ item.stock=prev; countEl.textContent=prev; toast('更新に失敗しました'); } })
    .catch(()=>{ item.stock=prev; countEl.textContent=prev; toast('通信エラー'); });
}
// 削除は「整理モード → 削除ボタン → 確認シートで長押し」の3段階にして誤操作を防ぐ
let stockEditMode = false;
let deleteTarget = null;
const HOLD_MS = 1500;
const editToggle = document.getElementById('stock-edit-toggle');
const sheetBackdrop = document.getElementById('sheet-backdrop');
const holdBtn = document.getElementById('hold-delete-btn');

function setStockEditMode(on){
  stockEditMode = on;
  editToggle.textContent = on ? '完了' : '整理';
  editToggle.classList.toggle('on', on);
  if(document.querySelector('nav.tabbar button.active').dataset.tab === 'stock'){
    document.getElementById('page-sub').textContent = on ? '不要になった商品を削除' : TAB_INFO.stock.sub;
  }
  renderStockList();
}
editToggle.addEventListener('click', ()=>setStockEditMode(!stockEditMode));

function openDeleteSheet(item){
  deleteTarget = item;
  document.getElementById('sheet-item-name').textContent = item.itemName;
  const stock = Number(item.stock) || 0;
  document.getElementById('sheet-stock-warn').textContent = stock > 0 ? `在庫がまだ ${stock} 個残っています。` : '';
  holdBtn.disabled = false;
  holdBtn.querySelector('span').textContent = '長押しで削除';
  sheetBackdrop.classList.add('show');
}
function closeDeleteSheet(){
  cancelHold();
  deleteTarget = null;
  sheetBackdrop.classList.remove('show');
}
document.getElementById('sheet-cancel-btn').addEventListener('click', closeDeleteSheet);
sheetBackdrop.addEventListener('click', e=>{ if(e.target === sheetBackdrop && !holdBtn.disabled) closeDeleteSheet(); });

function startHold(e){
  if(holdBtn.disabled || !deleteTarget) return;
  e.preventDefault();
  holdBtn.classList.add('holding');
  clearTimeout(startHold._t);
  startHold._t = setTimeout(executeDelete, HOLD_MS);
}
function cancelHold(){
  clearTimeout(startHold._t);
  holdBtn.classList.remove('holding');
}
holdBtn.addEventListener('pointerdown', startHold);
['pointerup','pointerleave','pointercancel'].forEach(ev=>holdBtn.addEventListener(ev, cancelHold));
holdBtn.addEventListener('contextmenu', e=>e.preventDefault());

function executeDelete(){
  const item = deleteTarget;
  if(!item) return;
  holdBtn.disabled = true;
  holdBtn.querySelector('span').textContent = '削除中…';
  postToGas({type:'stock', action:'delete', target:item.itemName})
    .then(res=>{
      if(res.status === 'success'){
        stockCache = stockCache.filter(r=>r !== item);
        closeDeleteSheet();
        renderStockList();
        toast(`「${item.itemName}」を削除しました`);
      } else {
        cancelHold(); holdBtn.disabled = false; holdBtn.querySelector('span').textContent = '長押しで削除';
        toast(res.message || '削除に失敗しました');
      }
    })
    .catch(()=>{
      cancelHold(); holdBtn.disabled = false; holdBtn.querySelector('span').textContent = '長押しで削除';
      toast('通信エラー');
    });
}

// タグ文字列を配列に分解（「,」のほか全角の「，」「、」も区切りとして扱う）
function splitTags(s){
  return String(s ?? '').split(/[,，、]/).map(t=>t.trim()).filter(Boolean);
}
// 重複と空欄を除いて五十音順に並べる
function uniqSorted(values){
  return [...new Set(values.map(v=>String(v ?? '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
}
// タグのチップ選択（複数選択）＋新規タグ入力欄
function createTagPicker(chipsId, inputId){
  const wrap = document.getElementById(chipsId);
  const input = document.getElementById(inputId);
  const selected = new Set();
  return {
    render(tags){
      // 名称変更・削除で無くなったタグは選択状態からも外す
      [...selected].forEach(t=>{ if(!tags.includes(t)) selected.delete(t); });
      wrap.innerHTML = '';
      tags.forEach(tag=>{
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (selected.has(tag) ? ' on' : '');
        chip.textContent = tag;
        chip.addEventListener('click', ()=>{
          if(selected.has(tag)) selected.delete(tag); else selected.add(tag);
          chip.classList.toggle('on', selected.has(tag));
        });
        wrap.appendChild(chip);
      });
    },
    // 選択中のタグと新規入力のタグを「,」区切りの文字列にする
    value(){
      return [...new Set([...selected, ...splitTags(input.value)])].join(',');
    },
    clear(){
      selected.clear();
      input.value = '';
      wrap.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
    }
  };
}
const stockTagPicker = createTagPicker('s-tags-chips', 's-tags-input');

function loadStock(){
  return fetch(`${GAS_URL}?action=getStock&t=${Date.now()}`)
    .then(r=>r.json())
    .then(rows=>{
      stockCache = rows;
      renderStockList();
      // 収納場所・タグの候補はスプレッドシートに登録済みの値から作る
      setupHybrid(document.getElementById('s-location-select'), document.getElementById('s-location-input'), uniqSorted(rows.map(r=>r.location)));
      stockTagPicker.render(uniqSorted(rows.flatMap(r=>splitTags(r.tags))));
    })
    .catch(()=>{ document.getElementById('stock-list').innerHTML = '<p class="empty-msg">読み込みに失敗しました</p>'; });
}
document.getElementById('stock-form').addEventListener('submit', e=>{
  e.preventDefault();
  const name = document.getElementById('s-name').value.trim();
  if(!name) return;
  const value = Number(document.getElementById('s-value').value) || 0;
  const location = getHybridValue(document.getElementById('s-location-select'), document.getElementById('s-location-input'));
  const tags = stockTagPicker.value();
  const expirationDate = document.getElementById('s-expiration').value;
  const modelNumber = document.getElementById('s-model').value.trim();
  postToGas({type:'stock', target:name, value, location, tags, expirationDate, modelNumber})
    .then(res=>{
      if(res.status==='success'){ toast('登録しました'); e.target.reset(); document.getElementById('s-value').value=1; stockTagPicker.clear(); loadStock(); }
      else toast('登録に失敗しました');
    }).catch(()=>toast('通信エラー'));
});

// ---------- 家計簿 ----------
const financeTagPicker = createTagPicker('f-tags-chips', 'f-tags-input');
let financeOpts = {categories:[], tags:[], tagCounts:{}};
// カテゴリ・タグの候補は家計簿シートに登録済みの値から作る
function loadFinanceOptions(){
  return fetch(`${GAS_URL}?action=getFinanceOptions&t=${Date.now()}`)
    .then(r=>r.json())
    .then(opts=>{
      financeOpts = opts;
      setupHybrid(document.getElementById('f-category-select'), document.getElementById('f-category-input'), uniqSorted(opts.categories || []));
      financeTagPicker.render(uniqSorted(opts.tags || []));
    })
    .catch(()=>toast('家計簿の候補の読み込みに失敗しました'));
}
setupHybrid(document.getElementById('f-category-select'), document.getElementById('f-category-input'), []);
document.getElementById('finance-form').addEventListener('submit', e=>{
  e.preventDefault();
  const category = getHybridValue(document.getElementById('f-category-select'), document.getElementById('f-category-input'));
  const amount = Number(document.getElementById('f-amount').value) || 0;
  const memo = document.getElementById('f-memo').value.trim();
  const tags = financeTagPicker.value();
  if(!category){ toast('カテゴリを選択してください'); return; }
  if(!amount) return;
  postToGas({type:'finance', category, amount, memo, tags})
    .then(res=>{
      if(res.status==='success'){ toast('記録しました'); e.target.reset(); financeTagPicker.clear(); loadFinanceOptions(); }
      else toast('記録に失敗しました');
    })
    .catch(()=>toast('通信エラー'));
});

// ---------- タグ管理（在庫・家計簿） ----------
// 要素を作る小さなヘルパー。文字列の子要素はテキストとして入るのでエスケープ不要
function h(tag, props = {}, ...children){
  const el = document.createElement(tag);
  Object.entries(props).forEach(([k, v])=>{
    if(k === 'class') el.className = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el[k] = v;
  });
  children.flat().forEach(c=>{ if(c != null && c !== false) el.append(c); });
  return el;
}
function errMsg(err){
  const m = err && err.message;
  return !m || m === 'Failed to fetch' || m === 'Load failed' ? '通信エラー' : m.replace(/^Error:\s*/, '');
}
// 長押しで実行するボタン（商品削除と同じ見た目）。onDone(reset) の reset で元に戻せる
function makeHoldButton(label, onDone){
  const span = h('span', {}, label);
  const btn = h('button', {type:'button', class:'hold-btn'}, h('div', {class:'fill'}), span);
  let timer;
  const reset = ()=>{ btn.disabled = false; btn.classList.remove('holding'); span.textContent = label; };
  const cancel = ()=>{ clearTimeout(timer); if(!btn.disabled) btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', e=>{
    if(btn.disabled) return;
    e.preventDefault();
    btn.classList.add('holding');
    timer = setTimeout(()=>{ btn.disabled = true; span.textContent = '処理中…'; onDone(reset); }, HOLD_MS);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev, cancel));
  btn.addEventListener('contextmenu', e=>e.preventDefault());
  return btn;
}

const TM_LABEL = {stock:'在庫', finance:'家計簿'};
const tm = {sheet:null, stack:[], busy:false};
const tmBackdrop = document.getElementById('tm-backdrop');
const tmBody = document.getElementById('tm-body');
const tmFoot = document.getElementById('tm-foot');
const tmTitle = document.getElementById('tm-title');
const tmBack = document.getElementById('tm-back');

function tmTagCounts(){
  if(tm.sheet === 'finance') return financeOpts.tagCounts || {};
  const counts = {};
  stockCache.forEach(r=>splitTags(r.tags).forEach(t=>counts[t] = (counts[t] || 0) + 1));
  return counts;
}
function openTagManager(sheet){
  tm.sheet = sheet;
  tm.stack = [];
  tmBackdrop.dataset.sheet = sheet;
  tmBackdrop.classList.add('show');
  tmShow(tmListView);
}
function closeTagManager(){
  if(tm.busy) return;
  tmBackdrop.classList.remove('show');
}
// 画面は「一覧 → タグ詳細 → 付与する行の選択」の順に積み重ね、「戻る」で1つ前に戻る
function tmShow(view, ...args){ tm.stack.push([view, args]); tmRender(); }
function tmRender(){
  const [view, args] = tm.stack[tm.stack.length - 1];
  tmBody.innerHTML = '';
  tmFoot.innerHTML = '';
  tmBody.scrollTop = 0;
  tmBack.style.visibility = tm.stack.length > 1 ? 'visible' : 'hidden';
  view(...args);
}
tmBack.addEventListener('click', ()=>{ if(!tm.busy && tm.stack.length > 1){ tm.stack.pop(); tmRender(); } });
document.getElementById('tm-close').addEventListener('click', closeTagManager);
tmBackdrop.addEventListener('click', e=>{ if(e.target === tmBackdrop) closeTagManager(); });
document.querySelectorAll('[data-tag-manage]').forEach(b=>b.addEventListener('click', ()=>openTagManager(b.dataset.tagManage)));

// GASでタグを一括操作し、成功したら候補とカウントを読み込み直す
function tagOp(payload){
  tm.busy = true;
  return postToGas({type:'tag', sheet:tm.sheet, ...payload})
    .then(res=>{
      if(res.status !== 'success') throw new Error(res.message || '処理に失敗しました');
      return (tm.sheet === 'stock' ? loadStock() : loadFinanceOptions()).then(()=>res);
    })
    .finally(()=>{ tm.busy = false; });
}
function hasSeparator(name){
  if(/[,，、]/.test(name)){ toast('タグ名に「,」「、」は使えません'); return true; }
  return false;
}

function tmListView(){
  tmTitle.textContent = `${TM_LABEL[tm.sheet]}のタグ`;
  const counts = tmTagCounts();
  const tags = uniqSorted(Object.keys(counts));
  const input = h('input', {type:'text', placeholder:'新しいタグ名'});
  const next = ()=>{
    const name = input.value.trim();
    if(!name || hasSeparator(name)) return;
    tmShow(counts[name] ? tmDetailView : tmAssignView, name);
  };
  tmBody.append(
    h('div', {class:'tm-section'},
      h('h3', {}, '新しいタグを作って付ける'),
      h('div', {class:'tm-inline'}, input, h('button', {type:'button', class:'tm-btn', onclick:next}, '次へ'))),
    h('div', {class:'tm-section'},
      h('h3', {}, '登録済みのタグ'),
      tags.length
        ? tags.map(t=>h('button', {type:'button', class:'tm-row', onclick:()=>tmShow(tmDetailView, t)},
            h('span', {class:'name'}, t), h('span', {class:'count'}, `${counts[t]}件`), h('span', {class:'chev'}, '›')))
        : h('p', {class:'tm-note'}, 'タグはまだありません'))
  );
}

function tmDetailView(tag){
  tmTitle.textContent = tag;
  const count = tmTagCounts()[tag] || 0;
  const input = h('input', {type:'text', value:tag});
  const renameBtn = h('button', {type:'button', class:'tm-btn', onclick:()=>{
    const newName = input.value.trim();
    if(!newName || newName === tag || hasSeparator(newName)) return;
    if(tmTagCounts()[newName] && !confirm(`「${newName}」は既にあります。「${tag}」を「${newName}」に統合しますか？`)) return;
    renameBtn.disabled = true;
    tagOp({action:'rename', tag, newName})
      .then(res=>{ toast(`${res.count}件のタグ名を変更しました`); tm.stack.pop(); tmShow(tmDetailView, newName); })
      .catch(err=>{ toast(errMsg(err)); renameBtn.disabled = false; });
  }}, '変更');
  const deleteBtn = makeHoldButton('長押しでタグを削除', reset=>{
    tagOp({action:'delete', tag})
      .then(res=>{ toast(`${res.count}件から「${tag}」を外しました`); tm.stack.pop(); tmRender(); })
      .catch(err=>{ toast(errMsg(err)); reset(); });
  });
  tmBody.append(
    h('p', {class:'tm-note tm-lead'}, `${count}件に付いています`),
    h('div', {class:'tm-section'},
      h('h3', {}, '名前を変更'),
      h('div', {class:'tm-inline'}, input, renameBtn),
      h('p', {class:'tm-note'}, '既にあるタグ名にすると、2つのタグが1つにまとめられます。')),
    h('div', {class:'tm-section'},
      h('h3', {}, 'まとめて付ける'),
      h('button', {type:'button', class:'tm-btn tm-wide', onclick:()=>tmShow(tmAssignView, tag)}, '付ける行を選ぶ')),
    h('div', {class:'tm-section'},
      h('h3', {}, '削除'),
      h('p', {class:'tm-note'}, 'すべての行からこのタグを外します。行そのものは削除されません。'),
      deleteBtn)
  );
}

function tmAssignView(tag){
  tmTitle.textContent = `「${tag}」を付ける`;
  const selected = new Map(); // key → GASに送る対象
  const submit = h('button', {type:'button', class:'tm-btn tm-wide'});
  const update = ()=>{
    submit.disabled = selected.size === 0;
    submit.textContent = selected.size ? `${selected.size}件に付ける` : '付ける行を選んでください';
  };
  submit.addEventListener('click', ()=>{
    submit.disabled = true;
    submit.textContent = '処理中…';
    tagOp({action:'assign', tag, targets:[...selected.values()]})
      .then(res=>{
        toast(`${res.count}件に「${tag}」を付けました`);
        tm.stack.pop();
        const [view, args] = tm.stack[tm.stack.length - 1];
        if(view === tmDetailView && args[0] === tag) tmRender(); else tmShow(tmDetailView, tag);
      })
      .catch(err=>{ toast(errMsg(err)); update(); });
  });
  update();
  tmFoot.append(submit);

  const makeRow = (key, target, title, sub, has)=>{
    const cb = h('input', {type:'checkbox', checked:has, disabled:has, onchange:()=>{
      if(cb.checked) selected.set(key, target); else selected.delete(key);
      update();
    }});
    return h('label', {class:'tm-check' + (has ? ' done' : '')}, cb,
      h('div', {class:'main'}, h('div', {class:'t1'}, title), h('div', {class:'t2'}, has ? '付与済み' : sub)));
  };

  if(tm.sheet === 'stock'){
    const items = [...stockCache].sort((a,b)=>String(a.itemName).localeCompare(String(b.itemName), 'ja'));
    if(!items.length){ tmBody.append(h('p', {class:'tm-note'}, '商品がありません')); return; }
    items.forEach(it=>{
      const tags = splitTags(it.tags);
      const sub = [it.location, tags.join(', ')].filter(Boolean).join(' ・ ') || '収納場所・タグなし';
      tmBody.append(makeRow(it.itemName, it.itemName, it.itemName, sub, tags.includes(tag)));
    });
    return;
  }

  // 家計簿は新しい順に30件ずつ読み込み、月ごとに見出しを付ける
  const PAGE = 30;
  let offset = 0, lastMonth = null;
  const list = h('div');
  const status = h('p', {class:'tm-note'}, '読み込み中…');
  const more = h('button', {type:'button', class:'cancel-btn', onclick:()=>loadMore()});
  tmBody.append(list);
  function loadMore(){
    more.remove();
    status.textContent = '読み込み中…';
    tmBody.append(status);
    fetch(`${GAS_URL}?action=getFinance&offset=${offset}&limit=${PAGE}&t=${Date.now()}`)
      .then(r=>r.json())
      .then(data=>{
        status.remove();
        data.rows.forEach(r=>{
          const d = new Date(r.date);
          const month = `${d.getFullYear()}年${d.getMonth() + 1}月`;
          if(month !== lastMonth){ list.append(h('div', {class:'tm-month'}, month)); lastMonth = month; }
          const tags = splitTags(r.tags);
          const title = `${d.getMonth() + 1}/${d.getDate()}　${r.category || '—'}　¥${(Number(r.amount) || 0).toLocaleString()}`;
          const sub = [r.memo, tags.join(', ')].filter(Boolean).join(' ・ ') || 'メモ・タグなし';
          list.append(makeRow('row' + r.row, {row:r.row, date:r.date}, title, sub, tags.includes(tag)));
        });
        offset += data.rows.length;
        if(!data.total) list.append(h('p', {class:'tm-note'}, '記録がありません'));
        else if(offset < data.total){
          more.textContent = `さらに${PAGE}件読み込む（残り${data.total - offset}件）`;
          tmBody.append(more);
        }
      })
      .catch(()=>{ status.textContent = '読み込みに失敗しました'; });
  }
  loadMore();
}

// ---------- 家事 ----------
setupHybrid(document.getElementById('c-cycle-select'), document.getElementById('c-cycle-input'), []);

function renderChoreList(){
  const wrap = document.getElementById('chore-list');
  const todo = choreCache.filter(t => !(t.isDone === true || String(t.isDone).toUpperCase() === 'TRUE'));
  if(!todo.length){ wrap.innerHTML = '<p class="empty-msg">今日やる家事はありません</p>'; return; }
  wrap.innerHTML = '';
  todo.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-info">
        <div class="card-name">${escapeHtml(t.taskName)}</div>
        <div class="card-meta">${escapeHtml(t.cycle || '—')}</div>
      </div>
      <button class="done-btn" type="button">完了</button>`;
    card.querySelector('.done-btn').addEventListener('click', ()=>completeChore(t, card));
    wrap.appendChild(card);
  });
}
function completeChore(t, card){
  card.style.opacity = '0.4';
  postToGas({type:'todo', action:'done', id:t.id})
    .then(res=>{
      if(res.status === 'success'){ toast('完了しました'); t.isDone = true; renderChoreList(); }
      else { card.style.opacity='1'; toast('更新に失敗しました'); }
    }).catch(()=>{ card.style.opacity='1'; toast('通信エラー'); });
}
function loadChores(){
  fetch(`${GAS_URL}?action=getTasks&t=${Date.now()}`)
    .then(r=>r.json())
    .then(rows=>{
      choreCache = rows;
      renderChoreList();
      // 周期の候補は家事シートに登録済みの値から作る
      setupHybrid(document.getElementById('c-cycle-select'), document.getElementById('c-cycle-input'), uniqSorted(rows.map(r=>r.cycle)));
    })
    .catch(()=>{ document.getElementById('chore-list').innerHTML = '<p class="empty-msg">読み込みに失敗しました</p>'; });
}
document.getElementById('chore-form').addEventListener('submit', e=>{
  e.preventDefault();
  const taskName = document.getElementById('c-name').value.trim();
  if(!taskName) return;
  const cycle = getHybridValue(document.getElementById('c-cycle-select'), document.getElementById('c-cycle-input'));
  postToGas({type:'todo', action:'add', taskName, cycle})
    .then(res=>{
      if(res.status==='success'){ toast('登録しました'); e.target.reset(); loadChores(); }
      else toast('登録に失敗しました');
    }).catch(()=>toast('通信エラー'));
});

// ---------- 初期化 ----------
loadStock();
loadFinanceOptions();
loadChores();
</script>
